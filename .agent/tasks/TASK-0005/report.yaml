epistemic_semantics:
  REPRODUCED: A concrete calibration/gaming exploit is demonstrated and attributable to the exact TASK-0005 assurance subject
    or its exact derived enforcement aids.
  NOT_REPRODUCED: The attack was independently challenged and no concrete exploit was demonstrated from the available exact
    evidence. This does not mean clean, disproven, or impossible.
  UNKNOWN: Available attributable evidence is insufficient to determine a material calibration claim safely. UNKNOWN is never
    PASS or N/A and blocks V1 release assurance when material to that release claim.
level_zero_calibration:
  result: NOT_REPRODUCED
  evidence: Level 0 has no requirement IDs and is reached whenever the complete applicable Level 1 gate is not satisfied. Because
    achievement is cumulative and non-numeric, missing Level 1 evidence cannot be offset by higher-level evidence, N/A counts,
    artifact volume, or points.
  gaming_challenge: Attempted to obtain positive maturity below an incomplete Level 1 baseline or to use a higher-level PASS
    as compensation; the normative cumulative rule forbids both paths.
