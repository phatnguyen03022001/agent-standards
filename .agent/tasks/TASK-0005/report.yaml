synthetic_adversarial_fixtures:
- id: FTX-CLI
  name: tiny deterministic CLI
  observable_facts:
  - Single-process local CLI with deterministic scalar input-to-output transformation and no network listener.
  - No authentication, privileged operation, security-sensitive secret, attacker-controlled remote interaction, or material
    trust/authority boundary is in scope.
  - No personal or privacy-sensitive information is observed, derived, stored, transmitted, exposed, or acted on.
  - Input is material to the claimed result and crosses a pure transformation/integrity boundary; after acceptance no in-scope
    state transition mutates material data, and no persistence, replication, recovery interaction, or concurrent material modification
    exists.
  - Output cannot directly cause or materially increase credible severe real-world harm beyond ordinary correctness/service
    loss.
  dimension_applicability:
    applicable:
    - COR
    - REL
    - PER
    - OBS
    - MNT
    - OPS
    - CMP
    - SUP
    - EFF
    - ASR
    - DAT
    na:
    - SEC
    - PRI
    - SAF
    derivation: DAT applies from the explicit material transformation fact. SEC/PRI/SAF are N/A only because their canonical
      dimension predicates are explicitly false in this fixture; the CLI label itself establishes nothing.
  requirement_applicability_notes:
  - DAT-2.2, DAT-2.4, and DAT-2.5 are N/A from the explicit absence of a state transition changing material data or concurrent
    modification; DAT-2.3 remains applicable because the dimension applies and accepted data crosses the transformation boundary.
  - DAT-3.1 is N/A only under the fixture's explicit absence of corruption/replay/ordering/partial-write/replication/migration/recovery-interaction
    paths; REL conditionals are N/A only where the stated facts exclude waiting, retries, or dependencies.
  - Conditional high-level requirements do not disappear by target labeling; highest-consequence subsets within every applicable
    dimension remain non-vacuous.
  representative_evidence:
    L1: Deterministic success/rejection tests, failure signals, explicit supported invocation/contract, input provenance, and
      measured bounded runtime/resources tied to the exact revision.
    L3: Pathological inputs, interrupted/abnormal executions, resource amplification, and material-data integrity challenges
      exercised over the complete small operating envelope where factually applicable.
    L5: Explicit highest-consequence assumptions/envelopes plus independent reproduction of the complete small behavioral,
      data-integrity, performance/resource, operations, compatibility, supply-chain, and assurance claims. Small scope lowers
      evidence volume, not the independence bar.
  gaming_conclusion: NOT_REPRODUCED
  gaming_evidence: No points or complexity quota exists. A genuinely tiny target may earn Level 5 if every applicable lower requirement
    passes and the complete highest-consequence envelope is independently reproduced; simplicity alone grants no credit.
- id: FTX-WEB
  name: conventional production web service
  observable_facts:
  - Public HTTP service accepts attacker-controlled requests and exposes authenticated and privileged operations.
  - Stores and transmits persistent user account/profile records containing personal information.
  - Material records cross request, application, storage, and external-service boundaries.
  - Uses external dependencies and has ordinary deployment/release, latency/capacity, failure/retry, monitoring, and operational
    lifecycle concerns.
  - No output/action can directly cause or materially increase credible severe real-world harm beyond ordinary service, confidentiality,
    privacy, or correctness loss.
  dimension_applicability:
    applicable:
    - COR
    - REL
    - PER
    - OBS
    - MNT
    - OPS
    - CMP
    - SUP
    - EFF
    - ASR
    - SEC
    - PRI
    - DAT
    na:
    - SAF
    derivation: SEC, PRI, and DAT apply from explicit trust-boundary, personal-information, and material-data-boundary facts.
      SAF is N/A only from the explicit absence of severe-harm capability.
  requirement_applicability_notes:
  - SEC confidentiality/integrity conditionals apply where the stated account/session/secret assets create those interests.
  - PRI lifecycle/access/disclosure/deletion requirements apply; PRI-2.5 applies only if an externally-owned privacy constraint
    factually governs the processing.
  - DAT state-transition and concurrency requirements apply where persistent user records can be changed concurrently; REL/OBS/PER/EFF
    conditionals apply from the stated dependency/retry/overload facts.
  representative_evidence:
    L1: Expected/rejected endpoint tests; authorization and privacy-purpose/exposure tests; data-integrity tests; attributable
      failure signals; executable deployment/use procedures; exact revision/dependency evidence.
    L3: Abuse/privilege challenge, race and partial-write scenarios, dependency degradation/retries, overload/backpressure,
      privacy leakage/inference paths, cascading diagnostic paths, and deployment/degraded-state exercises.
    L5: Explicit highest-consequence account/data/privacy/security/availability envelopes, full selected compatibility and construction
      models, and independent reproduction/derivation of their direct evidence plus ASR end-to-end trace.
  gaming_conclusion: NOT_REPRODUCED
  gaming_evidence: Omitting a data inventory or calling the service 'ordinary' cannot create N/A; missing applicability evidence
    becomes UNKNOWN and L4/L5 selected scope/exclusions receive independent challenge.
- id: FTX-TXN
