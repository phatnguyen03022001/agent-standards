current_attack_results:
- attack_id: CAL-001
  attack: Higher levels add ceremony or restate lower-level behavior without materially stronger assurance.
  result: NOT_REPRODUCED
  evidence: The 14x5 matrix shows higher levels add abnormal/hostile conditions, highest-consequence containment/recovery, independent
    review, explicit assumptions, and/or independent reproduction rather than artifact count.
- attack_id: CAL-002
  attack: A target can empty Level 4/5 scope by declaring no component/path 'critical', 'major', or equivalent.
  result: NOT_REPRODUCED
  evidence: STANDARD_MODEL requires the highest-consequence material applicable subset even when no target label exists; uncertain
    classification becomes UNKNOWN and exclusions are independently challengeable.
- attack_id: CAL-003
  attack: A materially narrower assessed scope can be presented as a broader high-maturity claim without consequence.
  result: NOT_REPRODUCED
  evidence: PASS is scoped to the assessed scope/revision/environment; evidence must be attributable to that claimed scope, while
    ASR-4.4 independently challenges high-consequence claim selection/exclusions. A broader claim without attributable evidence
    remains unresolved rather than inheriting a narrower PASS.
- attack_id: CAL-004
  attack: Level 5 can be self-certified by relabeling target-produced evidence as independent.
  result: NOT_REPRODUCED
  evidence: STANDARD_MODEL rejects self-certification by relabeling; each dimension has Level 5 independent_reproduction evidence
    and ASR-5.4 requires reproduction/derivation of each highest-consequence claim's direct evidence.
- attack_id: CAL-005
  attack: Ordinary static or review evidence is sufficient for Level 5 runtime/behavioral claims.
  result: NOT_REPRODUCED
  evidence: Runtime claims require runtime-capable or logically equivalent evidence; Level 5 behavior/envelope requirements use
    reproducible_test, operational_exercise, runtime_observation where appropriate, or formal_verification under independent
    reproduction.
- attack_id: CAL-006
  attack: Level 5 eligibility depends on rarity, architecture sophistication, system size, or an implicit quota.
  result: NOT_REPRODUCED
  evidence: No numerical/rarity rule exists. Exceptional evidence is the bar; the tiny CLI fixture can qualify only by satisfying
    every applicable lower requirement and independently reproducing its complete explicit highest-consequence envelope.
- attack_id: CAL-007
  attack: A higher-level PASS, duplicated evidence, or strong evidence elsewhere can compensate for a lower-level blocker.
  result: NOT_REPRODUCED
  evidence: Cumulative achievement explicitly makes PARTIAL/GAP/UNKNOWN/EXCEPTION block their level and every higher level; there
    are no points, averages, percentages, or cross-requirement compensation.
- attack_id: CAL-008
  attack: Synthetic archetype names can silently establish applicability or N/A.
  result: NOT_REPRODUCED
  evidence: All six fixtures derive applicability only from enumerated observable facts and canonical predicates; the same archetype
    would change outcome if its facts changed.
- attack_id: CAL-009
  attack: Missing documentation, inventory, or target identification can manufacture N/A.
  result: NOT_REPRODUCED
  evidence: STANDARD_MODEL derives applicability from underlying facts and maps insufficient predicate evidence to UNKNOWN;
    ASR external-constraint inventory obligations expose omissions rather than making them false.
- attack_id: CAL-010
  attack: The same artifact/evidence can be double-counted across dimensions to inflate maturity without proving each property.
  result: NOT_REPRODUCED
  evidence: There is no additive score. Each applicable requirement independently requires direct evidence of its own demonstrates
    obligation; one observation may support distinct claims only when it directly proves each, otherwise the unsupported obligation
    remains unresolved.
- attack_id: CAL-011
  attack: ASR can replace substantive engineering assurance by proving only that claims/evidence records exist.
  result: NOT_REPRODUCED
  evidence: STANDARD_MODEL explicitly assigns ASR identification/traceability while substantive dimensions own implementation
    behavior; ASR-5.4 reproduces direct evidence but does not waive any substantive requirement.
- attack_id: CAL-012
  attack: Post-remediation candidate permits the known OBS-1.1 runtime claim to regress to static-only evidence while bounded
    assurance remains green.
  result: NOT_REPRODUCED
  evidence: Post-remediation tests pin OBS-1.1 runtime-capable classes exactly and include the artifact-only mutant rejection;
    generic validator remains intentionally non-semantic.
- attack_id: CAL-013
  attack: TASK-0004 closure became a generalized semantic classifier that creates new false confidence outside the two known properties.
  result: NOT_REPRODUCED
  evidence: The guards name exact ASR-4.3 and OBS-1.1 identities/properties. A dedicated boundedness test mutates SEC-2.3 and OBS-2.2
    and confirms those unrelated mutations are not claimed to be classified by the guards.
- attack_id: CAL-014
  attack: Applicable externally-owned constraints can be omitted and still support high maturity.
  result: NOT_REPRODUCED
  evidence: ASR-1.2 requires inventory/source/applicability rationale, ASR-2.4/2.5 require constraint-to-claim-to-evidence trace,
    ASR-4.5 independently challenges completeness, and substantive dimensions enforce identified domain behavior where applicable.
- attack_id: CAL-015
  attack: TASK-0004 bounded guards implicitly create a reusable target applicability profile or semantic policy subsystem.
  result: NOT_REPRODUCED
  evidence: The regression block is exact identity/property comparison in tests only; it contains no target facts, profiles,
    registry, policy engine, natural-language classifier, or target assessment path.
- attack_id: CAL-016
  attack: Level 4 independent review is only procedural ceremony because no direct stronger property evidence is required.
  result: NOT_REPRODUCED
  evidence: Across dimensions, Level 4 requirements pair consequence-scope selection with concrete stronger containment/recovery/runtime/conformance
    properties where the property is behavioral; static dimensions such as MNT use direct structural/analysis evidence appropriate
    to their claim.
- attack_id: CAL-017
  attack: Level 5 independent reproduction can be satisfied by reproducing only the assessor's paperwork rather than the underlying
    engineering evidence.
  result: NOT_REPRODUCED
  evidence: Independence semantics require reproduction or independent derivation of evidence; ASR-5.4 explicitly targets direct
    evidence for each highest-consequence engineering claim, while substantive Level 5 requirements target their property envelopes.
