level_4_5_anti_gaming:
  result: NOT_REPRODUCED
  scope_selection: For every applicable dimension, the highest-consequence material subset remains non-vacuous even without
    target labels; unresolved classification or exclusion evidence becomes UNKNOWN. ASR-4.4 independently challenges selection
    and exclusions.
  level_4: Each dimension contains independent-review requirements; behavioral dimensions require stronger consequence-focused
    direct containment/recovery/conformance evidence rather than review ceremony alone.
  level_5: Every dimension contains at least one independent_reproduction requirement, and cumulative achievement also requires
    all lower applicable requirements. Several dimensions separate explicit assumptions/trace from the reproduced property so
    paperwork cannot substitute for direct evidence.
  rarity_rule: No rarity quota, target percentage, architecture-complexity threshold, or system-size criterion was used. Eligibility
    is entirely evidence/property based.
cross_dimension_ownership:
- dimension: COR
  owns: Intended behavioral semantics, successful/rejected outcomes, and logical correctness across execution states.
  boundary: Does not replace DAT integrity across data boundaries, SEC authority/security properties, or domain truth.
  result: NOT_REPRODUCED
- dimension: SEC
  owns: Authority/trust boundaries, security confidentiality/integrity interests, fail-closed security decisions, and adversarial
    compromise containment.
  boundary: Does not own general data integrity, privacy-purpose/lifecycle semantics, or safety-domain bounds.
  result: NOT_REPRODUCED
- dimension: PRI
  owns: Purpose limitation, privacy exposure, minimization, retention, access, deletion, disclosure, and advanced privacy risk.
  boundary: Uses SEC for security boundary properties and DAT for general data integrity; does not substitute those substantive
    guarantees.
  result: NOT_REPRODUCED
- dimension: DAT
  owns: Integrity of material data across storage/transmission/persistence/replication/transformation boundaries, including atomicity/consistency/recovery.
  boundary: Does not define intended business semantics (COR) or attacker authority (SEC).
  result: NOT_REPRODUCED
- dimension: REL
  owns: Failure propagation, dependency failure, overload/degradation continuity, recovery, and multi-fault resilience.
  boundary: Does not own operator procedure quality (OPS) or causal signal quality (OBS).
  result: NOT_REPRODUCED
- dimension: PER
  owns: Delivered latency, throughput, capacity, saturation, and workload-envelope performance.
  boundary: EFF separately owns resource/cost consumption; the same measurement may support both only when it directly demonstrates
    both distinct properties.
  result: NOT_REPRODUCED
- dimension: OBS
  owns: Detectability, trustworthy signal capture, attribution, blind spots, and causal trace.
  boundary: Signals do not themselves prove containment/recovery owned by REL/SAF/SEC/other substantive dimensions.
  result: NOT_REPRODUCED
- dimension: MNT
  owns: Comprehensibility, change isolation, evolvability, impact analysis, and hidden coupling bounds.
  boundary: Does not own external compatibility promises (CMP) or correctness of changed behavior (COR).
  result: NOT_REPRODUCED
- dimension: OPS
  owns: Executable configuration/use/lifecycle, delivery/reversal, rollout/emergency transitions, and operator-controlled recovery
    procedures.
  boundary: Does not replace system resilience properties (REL) or observability properties (OBS).
  result: NOT_REPRODUCED
- dimension: CMP
  owns: Supported consumer/environment/interface contracts, ranges, version transitions, and compatibility conformance models.
  boundary: Does not own internal changeability (MNT) or general expected behavior outside supported contract scope (COR).
  result: NOT_REPRODUCED
- dimension: SUP
  owns: External/construction input identity, provenance, substitution/tampering detection, construction trust, and delivered-artifact
    recovery.
  boundary: Does not prove runtime security merely from provenance; SEC owns runtime/adversarial boundaries.
  result: NOT_REPRODUCED
- dimension: EFF
  owns: Compute/memory/storage/network/energy/monetary resource bounds, attribution, scaling, amplification, and worst-case resource
    envelope.
  boundary: Does not duplicate PER latency/throughput/capacity claims; shared tests require distinct direct oracles.
  result: NOT_REPRODUCED
- dimension: ASR
  owns: Claim/evidence attribution, unresolved-evidence honesty, external-constraint inventory/trace, independent evidence challenge,
    and reproduction completeness.
  boundary: ASR evidence about a claim never replaces the substantive property evidence owned by COR/SEC/PRI/DAT/REL/PER/OBS/MNT/OPS/CMP/SUP/EFF/SAF.
  result: NOT_REPRODUCED
- dimension: SAF
  owns: Credible severe-harm channels, containment boundaries, hazard analysis, emergency intervention, safety arguments, and safe
    operating envelope.
  boundary: External/domain safety truth remains with competent authority; SEC/DAT/COR keep ownership of their substantive supporting
    properties.
  result: NOT_REPRODUCED
evidence_economics:
  result: NOT_REPRODUCED
  pass_cost_model: 'PASS cost is attributable property evidence: defined scope/revision/environment, direct evidence obligations,
    runtime-capable proof for runtime claims, explicit unresolved states, independent review at Level 4, and exceptional independent
    reproduction/derivation at Level 5.'
  machinery_not_credit: No artifact count, tool count, framework choice, points, percentages, architecture sophistication, or
    process volume contributes to maturity.
  evidence_reuse: A single artifact or execution may support multiple requirements only when it directly demonstrates each distinct
    obligation; because there is no additive scoring, reuse creates no numerical double credit and unsupported obligations remain
    unresolved.
  ceremony_attack: No material requirement was demonstrated to add only ceremony while leaving the proved engineering property
    unchanged. Static evidence is used for static selection/structure/assumption claims; behavioral claims require runtime-capable
    or logically equivalent evidence.
