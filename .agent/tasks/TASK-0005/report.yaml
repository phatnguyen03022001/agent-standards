  representative_evidence:
    L1: Expected transaction outcomes/rejections, basic component-failure containment, integrity-preservation tests, failure
      signals, operator/release procedures, and exact dependency/input identity.
    L3: Race/replay/partial-commit/replication divergence, retry amplification, dependency loss/failover, overload/cascade, distributed
      causal tracing, and adversarial privilege paths exercised against explicit invariants.
    L5: Explicit highest-consequence transaction/integrity/security/continuity assumptions and multi-fault envelopes, independently
      reproduced end-to-end including recovery integrity and exact claim/evidence trace.
  gaming_conclusion: NOT_REPRODUCED
  gaming_evidence: A passing happy-path transaction suite cannot bypass L2/L3 blockers, and L5 requires independent reproduction
    across compounded failure/integrity envelopes rather than more artifacts.
- id: FTX-CTRL
  name: security-sensitive control plane
  observable_facts:
  - Untrusted API callers request privileged configuration/control effects across explicit authority boundaries.
  - Protected secrets and security-sensitive integrity interests exist.
  - Material configuration/state is persisted and transmitted; compromise can propagate to controlled resources.
  - No personal/privacy-sensitive information is processed in the assessed scope.
  - Control effects are assumed not to create a credible severe-real-world-harm channel beyond security/service/data consequences.
  dimension_applicability:
    applicable:
