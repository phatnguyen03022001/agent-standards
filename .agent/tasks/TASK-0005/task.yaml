structure_authority:
  status: RESOLVED
  source: "TASK-0005 read-only assurance boundary"
  rationale: "The standards candidate is read-only. The only Executor-owned repository mutation authorized is creation and commit of .agent/tasks/TASK-0005/report.yaml. No normative, validator, test, dependency, metadata, ref-topology, release, or future-task mutation is authorized."

objective: "Independently determine whether V1 Levels 0-5 and the 14 dimensions are calibrated strongly enough that high maturity reflects materially stronger engineering assurance rather than scoring mechanics, ceremony, self-certification, scope gaming, or weak evidence, while preserving minimal complexity and honest UNKNOWN semantics."

scope:
  required_changes:
    - "Perform a fresh independent read-only calibration and anti-gaming audit of the exact post-remediation V1 assurance candidate at 7ef9acaf5127e495fe1d789594e1b6b700dfa52c."
    - "Challenge every dimension across Levels 1-5 for meaningful cumulative progression: each higher level must require materially stronger property assurance or evidence rather than terminology, ceremony, duplicate proof, or restated lower-level behavior."
    - "Challenge Level 4 and Level 5 specifically for non-vacuous highest-consequence scope, stronger containment/assurance, independent challenge, and Level 5 exceptional evidence including independent reproduction or derivation where required."
    - "Do not use rarity as a quota. Determine only whether Level 5 has an exceptional evidence bar; if every assessed target genuinely satisfies it, every such target remains eligible."
    - "Use synthetic target archetypes only as adversarial fixtures, including at least a tiny deterministic CLI, conventional production web service, distributed transactional service, security-sensitive control plane, privacy-heavy platform, and severe-harm/safety-relevant system. Archetype names never establish applicability or N/A; every conclusion must derive from explicit observable target facts plus normative rules."
    - "For each fixture, state the minimal observable facts assumed, which dimensions/requirements become applicable or N/A from those facts, what distinguishes representative Level 1, Level 3, and Level 5 evidence, and whether any scoring or evidence path could grant unjustified high maturity."
    - "Attack cross-dimension ownership for material overlap, double-counting, or missing property ownership. ASR may own claim/evidence completeness and independence but must not replace the substantive engineering property owned by another dimension."
    - "Attack evidence economics: PASS should be expensive in attributable evidence, not in machinery. Identify requirements that add ceremony without proving a stronger property, or that permit a strong claim with evidence weaker than the claim."
    - "Re-check that TASK-0004 closures remain bounded regression assurance and did not accidentally create a generalized semantic classifier, implicit applicability profile, or new false-confidence path."
    - "Classify every material attack exactly as REPRODUCED, NOT_REPRODUCED, or UNKNOWN. NOT_REPRODUCED is not disproven or clean. UNKNOWN never becomes PASS or N/A and blocks V1 release assurance only when the unknown is material to the release claim."
    - "For every REPRODUCED finding record the violated normative rule, concrete calibration or gaming exploit, exact evidence, material consequence, correct owning layer, and minimal closure direction only. Do not propose implementation patches or future task authority."
    - "For every material UNKNOWN record exactly what evidence is missing, why it matters, and whether it blocks V1 release assurance."
    - "Create, commit, and push only .agent/tasks/TASK-0005/report.yaml as the durable Executor evidence artifact, then stop for Governing Architect review."
  allowed_existing_files_or_components:
    - STANDARD_MODEL.md
    - README.md
    - standards/manifest.yaml
    - standards/*.yaml
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
    - .agent/tasks/TASK-0003/*
    - .agent/tasks/TASK-0004/*
    - .agent/tasks/TASK-0005/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Audit subject is exactly the post-remediation V1 assurance candidate at 7ef9acaf5127e495fe1d789594e1b6b700dfa52c; this planning commit is not part of the semantic subject."
  - "The standards candidate, validator, tests, dependencies, README, and repository metadata are read-only during execution."
  - "The only authorized Executor mutation is .agent/tasks/TASK-0005/report.yaml and its commit/push on dev."
  - "Semantic rigor is maximal; false-confidence tolerance is near zero; complexity budget is minimal."
  - "An incorrect PASS must be harder to obtain than an honest UNKNOWN."
  - "Level 5 requires exceptional assurance evidence; rarity is an expected consequence, never a statistical target or acceptance criterion."
  - "Synthetic archetypes are adversarial fixtures only and never applicability profiles."
  - "Applicability and N/A are derived only from observable target facts and canonical predicates, never from archetype labels or missing documentation."
  - "Validator coverage must not pretend to exceed mechanically defensible knowledge."
  - "Calibration must judge stronger engineering assurance, not amount of ceremony, number of artifacts, tool count, or architecture sophistication."
  - "agent-standards judges engineering properties and evidence; it does not prescribe product documentation structure, workflow, target architecture, or universal build-versus-buy outcomes."
  - "TASK-0003 NOT_REPRODUCED results remain epistemically NOT_REPRODUCED unless new concrete evidence changes them."
  - "TASK-0004 acceptance does not imply V1 release readiness."
  - "No downstream fix, promotion, tag, release, or future task authority is created by this task."

forbidden_changes:
  - "Any mutation to STANDARD_MODEL.md, README.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, tests/test_validate.py, requirements-validator.txt, or any non-report repository content."
  - "Any modification to TASK-0005/task.yaml by Executor."
  - "Any TASK-0006 or later task artifact, fix artifact, proposed patch, review.yaml, continuation artifact, promotion artifact, or release artifact."
  - "Any branch creation, main mutation, merge, rebase, reset, force update, promotion, tag, release, repository metadata mutation, issue creation, or pull request mutation."
  - "Any statistical quota for Level 5."
  - "Any implicit applicability profile based on archetype names."
  - "Any new target-profile subsystem, scoring engine, points model, DSL, semantic parser, NLP/AI validator, policy engine, registry, framework, database, or workflow machinery."
  - "Any claim that NOT_REPRODUCED means clean or disproven."

