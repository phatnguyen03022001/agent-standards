acceptance_criteria:
  - id: AC-1
    requirement: "All 14 dimensions and Levels 1-5 receive explicit independent calibration review with no silent omission."
    evidence_required: "A complete dimension/level coverage matrix or equivalent report evidence tied to exact V1 artifacts."
  - id: AC-2
    requirement: "At least the six required synthetic archetypes are challenged as fact-based adversarial fixtures rather than applicability profiles."
    evidence_required: "Per-fixture observable facts, derived applicability/N/A, representative L1/L3/L5 evidence distinctions, and gaming conclusions."
  - id: AC-3
    requirement: "Level 4/5 non-vacuous scope, exceptional Level 5 evidence, cumulative lower-level blockers, independence, and evidence sufficiency are challenged for unjustified high-maturity paths without using rarity quotas."
    evidence_required: "Concrete adversarial cases and exact normative trace for every material conclusion."
  - id: AC-4
    requirement: "Cross-dimension overlap, missing ownership, double-counting, and ASR-versus-substantive-dimension boundaries are challenged for material calibration defects."
    evidence_required: "Explicit ownership analysis across all 14 dimensions with any ambiguity classified epistemically."
  - id: AC-5
    requirement: "TASK-0004 closures are re-checked as bounded exact-identity assurance and do not introduce generalized semantic classification or applicability semantics."
    evidence_required: "Direct inspection of the exact current regression guards and their boundedness."
  - id: AC-6
    requirement: "Every material attack is classified only as REPRODUCED, NOT_REPRODUCED, or UNKNOWN with exact release-assurance impact."
    evidence_required: "Per-attack evidence plus an epistemic consistency review."
  - id: AC-7
    requirement: "The audit creates no candidate mutation and persists only the canonical TASK-0005 report evidence."
    evidence_required: "Fresh final ref/tree/changed-path verification showing the report commit is the sole Executor change."
  - id: AC-8
    requirement: "The final conclusion states whether a material calibration defect or material UNKNOWN remains, without authorizing remediation or release."
    evidence_required: "Final bounded assurance conclusion traceable to exact findings and unknowns."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At audit start, require dev HEAD to equal the exact handoff base and confirm the TASK-0005 audit subject files match their 7ef9acaf5127e495fe1d789594e1b6b700dfa52c identities/content."
      required: true
    - id: CHECK-2
      command_or_check: "Complete the full 14-dimension/Levels 1-5 calibration matrix, six required fact-based synthetic fixtures, Level 4/5 anti-gaming challenge, cross-dimension ownership challenge, and TASK-0004 boundedness re-check."
      required: true
    - id: CHECK-3
      command_or_check: "Perform epistemic consistency review: no NOT_REPRODUCED result becomes clean/disproven, no UNKNOWN becomes PASS/N/A, and rarity is never used as a Level 5 quota."
      required: true
    - id: CHECK-4
      command_or_check: "Before report commit, verify the only intended Executor repository change is .agent/tasks/TASK-0005/report.yaml."
      required: true
    - id: CHECK-5
      command_or_check: "After report commit/push, refresh refs and verify dev equals the exact report commit, main remains 71f2be951c9d44452f5f53122f4062390ef4cb39, branch set remains exactly {dev, main}, and the report commit changes only .agent/tasks/TASK-0005/report.yaml relative to the handoff base."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions:
  - "Any material calibration finding remains a finding only; remediation requires later Governing Architect judgment and fresh authority."
  - "Any material UNKNOWN that prevents safe V1 calibration assurance blocks release assurance but does not manufacture a fix task by itself."
  - "If the audit cannot distinguish stronger evidence/property assurance from mere ceremony for a material Level 4/5 path, classify that path UNKNOWN rather than PASS."
  - "Promotion, tag, release, and any later work remain unauthorized."

execution_ready: true
