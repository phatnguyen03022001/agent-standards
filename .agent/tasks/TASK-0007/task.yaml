release_identity:
  version: v1.0.0
  tag: v1.0.0
  tag_kind: lightweight
  release_title: v1.0.0
  draft: false
  prerelease: false
  release_notes: |
    agent-standards v1.0.0 is the first stable release of the evidence-driven engineering maturity standard.

    Highlights:
    - Generation 1 with 14 engineering dimensions and cumulative Levels 0-5.
    - Explicit PASS, N/A, UNKNOWN, and EXCEPTION semantics designed to resist grade inflation and self-certification.
    - Evidence and independence requirements that make higher maturity materially stronger rather than more ceremonial.
    - Bounded deterministic regression assurance for known applicability and runtime-evidence false-green classes.
    - Independent semantic, calibration, anti-gaming, and final exact-candidate assurance completed before release.

    Consumers should pin the exact release tag or immutable commit identity when using the standard as an assessment authority.

