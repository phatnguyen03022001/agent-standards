structure_authority:
  status: RESOLVED
  source: "Existing candidate/assessment_kernel three-file sandbox"
  rationale: "Correction stays inside the existing candidate README/model/test surface plus canonical TASK-0012 report evidence; no new module, schema, dependency, validator layer, generation, family, or framework is justified."

objective: "Make accepted Assessment Kernel Candidate judgments and trajectory endpoints structurally attributable and non-ambiguous by rejecting blank/whitespace semantic identities, anonymous evidence, and duplicate/conflicting material-context keys, while explicitly preserving dependency satisfaction and trajectory facts as trusted structured inputs rather than inventing cross-assessment resolution machinery."

scope:
  required_changes:
    - "Use causal TDD against exact current candidate behavior before implementation. Add minimal regressions proving anonymous EvidenceRef identifiers, blank/whitespace assessment/claim/family/authority/subject/inference/dependency identity tokens, and duplicate material-context keys cannot participate in accepted/satisfied judgments or established trajectory identities."
    - "Implement one small reusable semantic-token predicate/helper only if it reduces duplicated validation without introducing a validation framework. Identity-bearing string values must contain at least one non-whitespace character; do not normalize case, rewrite identifiers, or invent global naming syntax."
    - "Require EvidenceRef.identifier to be identifying before its supported inference can contribute to accepted evaluation. Preserve exact supported-inference membership; do not add fuzzy matching, confidence, strength, NLP, or provenance scoring."
    - "Require Assessment.assessment_id, Assessment.claim_id, Assessment.family, NormativeAuthority.identifier, NormativeAuthority.immutable_revision, SubjectIdentity.kind, SubjectIdentity.identifier, Assessment.asserted_inference, and Dependency.claim_id to be identifying values wherever those values participate in evaluation or trajectory establishment."
    - "Reject ambiguous SubjectIdentity material_context when a context key or value is blank/whitespace or when the same key appears more than once. Required context keys must themselves be identifying and unique. Do not silently pick first/last values or normalize conflicting context."
    - "Ensure establish_trajectory rejects endpoints whose identity-bearing assessment/claim/family/authority/subject/context fields are structurally invalid or ambiguous. Do not require before/after evaluate() to be accepted merely because their local obligation evidence/judgment is incomplete; trajectory facts remain a separate trusted input boundary."
    - "Preserve Dependency.satisfied as an explicit trusted upstream fact. Do not require the kernel to resolve, fetch, or embed another Assessment, authority, evidence set, family registry, dependency graph, or global ontology. Only dependency identity hygiene and existing satisfied/unsatisfied behavior are in scope."
    - "Update candidate README only as needed to state the two trust boundaries unambiguously: Dependency.satisfied is caller-supplied structured fact, and TrajectoryFacts are caller-supplied structured facts independent of local obligation evaluation; neither permits blank/ambiguous endpoint/dependency identity."
    - "Keep candidate identity NON_RELEASED_CANDIDATE / authority NONE / generation NOT_ASSIGNED. Run focused candidate verification under explicit -B plus current repository-owned Generation 1 verification. Produce canonical TASK-0012 report evidence and stop at Architect review."
  allowed_existing_files_or_components:
    - candidate/assessment_kernel/README.md
    - candidate/assessment_kernel/model.py
    - candidate/assessment_kernel/test_model.py
    - .agent/tasks/TASK-0012/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Frozen Generation 1 main authority remains byte-for-byte unchanged."
  - "The candidate remains non-released and non-authoritative; this task assigns no generation."
  - "Only exact non-whitespace identity hygiene is added; no universal identifier syntax or ontology is introduced."
  - "Evidence inference support remains exact membership, with no strength/confidence/fuzzy semantics."
  - "UNKNOWN is not N/A; EXCEPTION is never PASS; no aggregation/scoring API is introduced."
  - "Dependency.satisfied remains trusted structured input; F-003 does not authorize cross-assessment dependency resolution machinery."
  - "Trajectory comparability, exact_property_changed, direction, change_bases, and history_relation remain trusted structured facts; F-004 does not authorize evaluate(before/after) as a universal trajectory gate."
  - "TASK-0009 F-001 stays closed: no ChangeBasis.SUBJECT universal requirement."

forbidden_changes:
  - "Any modification to README.md, STANDARD_MODEL.md, standards/*, tools/*, tests/*, requirements-validator.txt, LICENSE, main, tags, releases, repository metadata, CI, dependencies, agent-runtime, or agent-skills."
  - "Any new candidate module, manifest, registry, schema language, dependency graph, external assessment resolver, evidence-strength/confidence system, aggregation, family design, generation declaration, or global ontology."
  - "Any requirement that dependency satisfaction must embed/resolve another Assessment."
  - "Any requirement that establish_trajectory may run only when evaluate(before) and evaluate(after) are accepted."
  - "Any universal requirement for ChangeBasis.SUBJECT."
  - "Any cleanup unrelated to the three proven defect clusters."

