acceptance_criteria:
  - id: AC-1
    requirement: "F-001 is closed: anonymous/blank EvidenceRef identity cannot support an accepted satisfied judgment."
    evidence_required: "Causal regression fails on the pre-fix candidate and passes on final implementation."
  - id: AC-2
    requirement: "F-002 accepted subset is closed: blank/whitespace semantic identity tokens cannot produce accepted/satisfied judgments or valid trajectory identity."
    evidence_required: "Focused regressions cover assessment, claim, family, authority/revision, subject kind/id, asserted inference, dependency claim identity, and evidence identity without inventing naming syntax."
  - id: AC-3
    requirement: "F-005 is closed: duplicate or blank material-context identity keys/values cannot satisfy required context or establish a valid subject identity."
    evidence_required: "Focused duplicate/conflicting/blank context regressions fail before correction and pass after correction."
  - id: AC-4
    requirement: "F-003/F-004 are not over-fixed. Trusted dependency/trajectory fact boundaries remain executable and documented."
    evidence_required: "A satisfied dependency with valid claim identity still works without embedding another Assessment; valid attributable trajectory endpoints may establish trajectory from trusted facts even when local obligation evaluation is independently incomplete."
  - id: AC-5
    requirement: "Existing candidate semantics remain stable outside the correction."
    evidence_required: "All pre-existing candidate regressions plus new focused regressions PASS under explicit python -B; no aggregation/N/A/exception/no-SUBJECT regression."
  - id: AC-6
    requirement: "Frozen Generation 1 remains valid and unchanged."
    evidence_required: "Current repository-owned Generation 1 verification PASS on exact final implementation state; main unchanged."
  - id: AC-7
    requirement: "Implementation and report publication remain bounded."
    evidence_required: "Implementation diff changes only authorized candidate README/model/test files as actually needed; report commit changes only TASK-0012/report.yaml; final dev/main/branch topology and commit lineage verified."

