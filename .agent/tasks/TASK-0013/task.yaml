structure_authority:
  status: RESOLVED
  source: "repository root ignore policy plus existing canonical task/report layout"
  rationale: >-
    This task adds exactly one repository-root .gitignore plus the canonical TASK-0013 report. No standard,
    candidate model, validator, test semantics, package, workflow, runtime, protocol, or repository structure is otherwise changed.

objective: >-
  Add the smallest stack-appropriate repository-root .gitignore for agent-standards while naturally dogfooding the
  ecosystem-active deterministic-bundling semantics on CHATGPT_LOCAL: preserve every correctness/fail-closed predicate,
  collapse mechanically derivable work into bounded execution bundles, and record enough operational evidence to compare
  execution shape with the prior TASK-0036 62-call baseline without turning latency into a correctness shortcut.

scope:
  required_changes:
    - >-
      Create repository-root .gitignore containing only the supported baseline for this Python-backed support repository:
      .DS_Store; __pycache__/; *.py[cod]; .venv/; venv/; .pytest_cache/; .mypy_cache/; .ruff_cache/; .coverage;
      coverage/; .env; .env.* with !.env.example and !.env.*.example exceptions.
    - >-
      Do not add unrelated broad patterns such as .cache/, node_modules/, .next/, build/, dist/, candidate/, standards/,
      or an ignore for .agent unless fresh repository evidence proves exact need and the task is revised.
    - >-
      Preserve any pre-existing operator-owned untracked files exactly; do not delete, clean, stash, move, rewrite,
      or inspect their contents merely because a new ignore policy is being added.
    - >-
      Under the active agent-skills deterministic-bundling rule, once semantic choices/current authority/current-phase
      capabilities are resolved, execute the maximal contiguous mechanically derivable suffix as bounded bundle(s).
      Consequence-boundary refresh remains mandatory evidence work but is not by itself a model/runtime handoff.
    - >-
      Record in report evidence the actual Agent Runtime invocation count used after exact binding, including the number
      of terminal_exec calls and any terminal_start/poll/control calls if they occur; identify each genuine semantic
      control-return reason. Include the existing operational_timing block only if both canonical timing boundaries are
      truthfully captured. Do not add telemetry schema, runtime instrumentation, or persistent measurement machinery.
    - >-
      Publish the exact .gitignore candidate and compact report-only child on dev. Do not promote main in this task.
  allowed_existing_files_or_components:
    - ".gitignore"
    - ".agent/tasks/TASK-0013/report.yaml"

invariants:
  - "No tracked repository file becomes ignored by the new rules."
  - "Any tracked .env.example or .env.*.example remains trackable and is not hidden by the ignore rules."
  - "No existing local untracked operator-owned file is deleted or modified by this task."
  - "No standards, candidate assessment-kernel bytes, validators, tests, dependencies, workflows, protocol, runtime, Case Router, model policy, or sibling repository are modified."
  - "Deterministic bundling removes synchronization boundaries, not assurance predicates or authority boundaries."
  - "Bundle failure or ambiguous postcondition stops the remaining suffix, preserves truthful partial state, and returns attributable evidence without self-retry or self-chosen recovery."
  - "Topology remains exactly {dev, main}; main remains unchanged."

forbidden_changes:
  - "Do not delete or clean local untracked files just to obtain a clean status."
  - "Do not add generic framework/build ignores without repository evidence."
  - "Do not modify any tracked file other than .gitignore and .agent/tasks/TASK-0013/report.yaml."
  - "Do not modify Agent Runtime, add a bundle API, scheduler, queue, cache, registry, daemon, worktree transaction framework, or telemetry framework."
  - "Do not reduce verification, mutable-evidence refresh, publication proof, or fail-closed behavior to hit a latency/call-count target."
  - "Do not create/delete/rename branches, tags, releases, repository settings, or promote main."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

