    - git_commit
    - git_push
    - remote_ref_read

acceptance_criteria:
  - id: AC-1
    requirement: >-
      Exact base-to-candidate diff adds only root .gitignore with the authorized minimal patterns and no unrelated ignore entries.
    evidence_required: "Exact diff and parsed line-set proof."
  - id: AC-2
    requirement: >-
      git ls-files -ci --exclude-standard is empty on the exact candidate, and synthetic git check-ignore proves required
      positive cases are ignored while .env.example, a representative .env.test.example, and representative repository-owned paths remain unignored.
    evidence_required: "Exact deterministic ignore-policy evidence without modifying operator-owned files."
  - id: AC-3
    requirement: >-
      Repository-native verification remains green as applicable, git diff --check passes, and no unrelated tracked bytes change.
    evidence_required: "Repository-native verification plus exact diff/status evidence."
  - id: AC-4
    requirement: >-
      Execution obeys the active deterministic-bundling semantics: pre-authorized mechanically derivable work does not
      create per-command model/runtime handoffs, every bundle returns attributable JOIN evidence, and the report records
      actual runtime invocation counts plus genuine semantic control-return reasons. A performance miss does not authorize
      skipped proof; unexplained micro-orchestration is a protocol defect signal rather than a reason to weaken correctness.
    evidence_required: "Compact execution-shape evidence including terminal tool invocation counts and semantic-return classification."
  - id: AC-5
    requirement: >-
      Exact candidate and report-only child are published on dev; main is unchanged, topology remains {dev, main}, and
      final local tracked/index state is clean while pre-existing operator-owned untracked state is preserved.
    evidence_required: "Candidate/report identities, fresh refs/topology, and local hygiene proof."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: >-
        Fresh-resolve exact task/base, active architect-profile/main authority set, pinned agent-skills deterministic-bundling
        semantics, target refs/topology, root .gitignore absence, tracked-file inventory, local status, and current required
        capabilities without reading operator-owned untracked-file contents.
      required: true
    - id: CHECK-2
      command_or_check: >-
        In the smallest bounded deterministic execution shape permitted by semantics, add only the authorized .gitignore;
        run ignore-policy guards, git ls-files -ci --exclude-standard, repository-native verification as applicable,
        git diff --check, exact scope guards, and local hygiene checks with attributable JOIN evidence.
      required: true
    - id: CHECK-3
      command_or_check: >-
        Publish exact candidate and report-only child on dev with required fresh pre/post publication proofs; preserve
        operator-owned untracked state and do not self-attest report publication before post-push observation.
      required: true
    - id: CHECK-4
      command_or_check: >-
        Record actual Agent Runtime tool invocation counts and classify every model/controller return after binding as
        semantic, authority/capability, failure/ambiguity, or terminal. Capture existing operational_timing only when both
        required timestamps are trustworthy. Do not introduce measurement infrastructure.
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

