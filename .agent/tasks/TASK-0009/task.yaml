acceptance_criteria:
  - id: AC-1
    requirement: "F-001 is causally reproduced before correction."
    evidence_required: "A focused regression demonstrates that the revision-1 implementation rejects an otherwise valid comparable exact-property trajectory solely because ChangeBasis.SUBJECT is absent."
  - id: AC-2
    requirement: "Trajectory no longer requires a synthetic mandatory SUBJECT change basis."
    evidence_required: "Focused positive tests pass for at least one trajectory whose exact property changed under sufficient comparability with PROCESS and/or MARKET basis and no SUBJECT token."
  - id: AC-3
    requirement: "Removing the SUBJECT token gate does not reintroduce false trajectory."
    evidence_required: "Existing and/or added negative tests prove knowledge-only/correction and insufficient-comparability cases remain non-established when exact_property_changed is false or comparability is insufficient."
  - id: AC-4
    requirement: "All unrelated candidate semantics and frozen Generation 1 remain unchanged and verified."
    evidence_required: "Exact diff is limited to the three existing candidate files as needed; V1 validator and 54-test suite pass unchanged; full candidate suite passes."
  - id: AC-5
    requirement: "Revision-2 evidence is published without promotion or canonicalization."
    evidence_required: "Updated TASK-0009 report_revision 2 identifies exact task/base/implementation/report lineage, records F-001 reproduction and closure, dev-only state, unchanged main, and terminal NEEDS_REVIEW."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At revision-2 execution start refresh remote truth and require dev equals the exact handoff base, main remains 3f4950f280a3a35fee81471d4b83715fa72cf9ee, branches exactly {dev, main}, TASK-0009 revision 2 resolves at base, and pinned agent-skills is accessible."
      required: true
    - id: CHECK-2
      command_or_check: "Establish the focused failing F-001 regression against the revision-1 implementation semantics before applying the correction."
      required: true
    - id: CHECK-3
      command_or_check: "Run python -m unittest discover -s candidate/assessment_kernel -p 'test_*.py' -v and require all candidate regressions pass after correction."
      required: true
    - id: CHECK-4
      command_or_check: "On exact final implementation state run python tools/validate.py and python -m unittest discover -s tests -v; require Generation 1 validator and all existing tests pass unchanged."
      required: true
    - id: CHECK-5
      command_or_check: "Before implementation commit verify no path outside candidate/assessment_kernel/README.md, model.py, and test_model.py changed relative to the revision-2 handoff base except the already-present Architect-owned task revision; no new path exists."
      required: true
    - id: CHECK-6
      command_or_check: "After implementation commit/push verify dev equals the exact implementation commit and the execution delta from handoff base contains only authorized candidate corrections."
      required: true
    - id: CHECK-7
      command_or_check: "After report update commit/push verify dev equals the enclosing report commit, its sole parent is the final implementation commit, that report commit changes only .agent/tasks/TASK-0009/report.yaml, main remains unchanged, branches exactly {dev, main}, and no promotion/release/tag occurred."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions:
  - "If current refs, revision-2 task identity, or pinned skill identity drift before mutation, stop STALE_STATE."
  - "If deterministic Python test execution is unavailable, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before mutation."
  - "If closing F-001 requires changing frozen V1, adding structure/dependencies, or reopening unrelated candidate semantics, stop AUTHORITY_REQUIRED."
  - "If the new regression exposes a broader contradiction in K11/K12 rather than the reproduced SUBJECT-token overconstraint, stop BLOCKED or AUTHORITY_REQUIRED instead of redesigning silently."
  - "No main mutation, promotion, tag, release, or Generation 2 canonicalization is authorized."

execution_ready: true
