acceptance_criteria:
  - id: AC-1
    requirement: "The candidate is unmistakably non-authoritative and isolated from frozen Generation 1 authority."
    evidence_required: "Candidate identity is deterministically observable as NON_RELEASED_CANDIDATE / NONE / NOT_ASSIGNED; exact diff proves no V1 authority/enforcement file changed."
  - id: AC-2
    requirement: "Material semantics are explicit structured inputs, not inferred from prose."
    evidence_required: "Focused tests demonstrate causal-vs-observational inference, applicability truth, material context, and dependency behavior using explicit structured facts; inspection shows no NLP/keyword/prose heuristic path."
  - id: AC-3
    requirement: "Applicability, conformance/knowledge, and optional exception disposition preserve the required distinctions without forcing the V1 flat token set as a universal future-family contract."
    evidence_required: "Tests prove unknown applicability cannot become N/A; PASS is the only satisfying applicable judgment; PARTIAL/GAP/UNKNOWN do not satisfy; accepted EXCEPTION cannot become PASS or maturity satisfaction."
  - id: AC-4
    requirement: "Every material judgment preserves exact normative authority identity, claim-relative material subject identity/context, and attributable evidence identity."
    evidence_required: "Positive and negative tests show missing required authority/evidence/material context blocks or preserves uncertainty as appropriate, while unrelated universal context is not required."
  - id: AC-5
    requirement: "Trajectory cannot be inferred from assessment delta alone and does not require source revision change."
    evidence_required: "One positive same-source substantive-property trajectory case plus at least two negative knowledge/correction/comparability cases pass deterministically."
  - id: AC-6
    requirement: "Cross-family judgments do not automatically substitute for each other, while explicit semantic dependencies can constrain a dependent claim."
    evidence_required: "A transparency/expectation claim remains independently assessable beside a security GAP; a separate explicitly security-dependent claim cannot PASS when its represented dependency is unmet."
  - id: AC-7
    requirement: "The candidate provides no synthetic aggregation or scalar maturity mechanism and does not hide failures through compensation."
    evidence_required: "Tests and source inspection show obligation satisfaction is local/claim-bound and no family/dimension/overall scoring or aggregation API exists."
  - id: AC-8
    requirement: "Archetypes remain test-fixture packaging only."
    evidence_required: "Tests may group cases by archetype names, but source inspection proves model.py contains no archetype-name branch, mapping, profile, or applicability shortcut."
  - id: AC-9
    requirement: "Historical correction, multi-causal change basis, and assessment-history attribution remain distinguishable from substantive subject evolution."
    evidence_required: "Deterministic regressions cover multiple simultaneous change bases and correction/supersession without falsely emitting subject improvement."
  - id: AC-10
    requirement: "Frozen Generation 1 verification remains green and byte-identical in semantics/enforcement while candidate focused verification passes."
    evidence_required: "Required V1 validator/test commands and candidate unittest command pass on exact final implementation state; compare shows only authorized candidate files before report."
  - id: AC-11
    requirement: "Executor publishes bounded evidence and stops for Architect review without promotion or canonicalization."
    evidence_required: "Exact report commit lineage and diff show only TASK-0009/report.yaml after the final implementation commit; dev contains the candidate/report, main remains unchanged, branches remain exactly {dev, main}, terminal result NEEDS_REVIEW."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At start refresh remote truth and require dev equals exact handoff base, main equals 3f4950f280a3a35fee81471d4b83715fa72cf9ee, branches exactly {dev, main}, TASK-0009 revision 1 resolves at base, and pinned agent-skills 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 is accessible."
      required: true
    - id: CHECK-2
      command_or_check: "Before mutation run python tools/validate.py and python -m unittest discover -s tests -v against the exact handoff-base Generation 1 state; both must pass."
      required: true
    - id: CHECK-3
      command_or_check: "Establish focused failing candidate regressions for the authorized behavior where the execution surface can preserve causal TDD evidence, then implement the minimum dependency-free candidate model."
      required: true
    - id: CHECK-4
      command_or_check: "Run python -m unittest discover -s candidate/assessment_kernel -p 'test_*.py' -v and require all candidate regressions pass."
      required: true
    - id: CHECK-5
      command_or_check: "On exact final implementation state rerun python tools/validate.py and python -m unittest discover -s tests -v; both must pass unchanged, then rerun candidate focused tests."
      required: true
    - id: CHECK-6
      command_or_check: "Before implementation commit verify changed paths are exactly candidate/assessment_kernel/README.md, model.py, and test_model.py; verify frozen V1 content blobs and main ref remain unchanged."
      required: true
    - id: CHECK-7
      command_or_check: "After implementation commit/push verify dev equals the exact implementation commit and compare from handoff base contains only the three authorized candidate files. Then create only TASK-0009/report.yaml."
      required: true
    - id: CHECK-8
      command_or_check: "After report commit/push verify dev equals the enclosing report commit, its sole parent is the final implementation commit, the report commit changes only .agent/tasks/TASK-0009/report.yaml, main remains 3f4950f280a3a35fee81471d4b83715fa72cf9ee, branches remain exactly {dev, main}, and no promotion/release/tag occurred."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions:
  - "If dev/main/branch topology or TASK-0009/pinned-skill identity drifts before mutation, stop STALE_STATE."
  - "If deterministic Python test execution is unavailable for the current EXECUTION phase, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before mutation rather than implementing unverified code."
  - "If the smallest correct implementation requires changing frozen V1 semantics/enforcement, adding a dependency/parser/schema/framework, or defining future family/dimension semantics, stop AUTHORITY_REQUIRED for Architect revision."
  - "If a deterministic counterexample shows an authorized candidate invariant is wrong or ambiguous, do not silently redesign it; record the blocker and stop BLOCKED or AUTHORITY_REQUIRED as appropriate."
  - "No main mutation, promotion, tag, release, or Generation 2 canonicalization is authorized by TASK-0009."

execution_ready: true
