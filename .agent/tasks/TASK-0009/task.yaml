structure_authority:
  status: RESOLVED
  source: "Current repository structure plus pinned simplicity guidance and explicit user-approved candidate isolation"
  rationale: "The smallest sufficient implementation is one shallow isolated top-level candidate sandbox containing exactly a human-readable candidate identity/semantics note, one dependency-free Python model/evaluator, and one deterministic unittest regression module. The candidate must not enter standards/, modify the V1 validator, or introduce a package/framework/schema layer before the semantics are proven."

objective: "Implement a visibly non-authoritative, non-released Assessment Kernel Candidate that makes the corrected shared assessment semantics explicit enough for deterministic evaluation, encodes the material adversarial counterexamples as executable regressions, and leaves frozen Generation 1 authority completely unchanged."

candidate_semantics:
  identity:
    status: NON_RELEASED_CANDIDATE
    authority: NONE
    generation: NOT_ASSIGNED
  invariants:
    - id: K1
      statement: "Evidence must support the exact semantics, scope, and inference asserted by a judgment; an assessment must not assert any stronger inference than the explicitly represented evidence establishes."
    - id: K2
      statement: "Applicability is fact-based. Factual non-applicability is distinct from unknown applicability; insufficient applicability evidence must not become N/A."
    - id: K3
      statement: "Incomplete establishment, known non-conformance, and insufficient knowledge remain distinguishable. Candidate representation may separate applicability, judgment, and disposition semantics; it must not mechanically require every future family to expose the full Generation 1 flat status vocabulary."
    - id: K4
      statement: "Only PASS satisfies an applicable maturity obligation. PARTIAL or equivalent incomplete state, GAP, UNKNOWN, and any unmet obligation carrying an accepted EXCEPTION disposition do not become PASS or manufacture maturity."
    - id: K5
      statement: "EXCEPTION is disposition semantics for an unmet applicable obligation, not a mechanism that converts non-conformance into PASS. Generation 1 EXCEPTION representation remains untouched."
    - id: K6
      statement: "No family maturity scalar exists by default. No dimension scalar exists unless a defensible cumulative ordinal ladder is explicitly established outside this candidate."
    - id: K7
      statement: "Every material judgment identifies the exact immutable normative authority/semantics under which it was made."
    - id: K8
      statement: "Every material judgment remains attributable to the evidence used to establish it."
    - id: K9
      statement: "Subject identity is typed and claim-relative: include known or reasonably identifiable context material to interpreting the exact judgment without imposing a universal mega-schema. Missing material identity/context preserves uncertainty rather than silently assuming equivalence."
    - id: K10
      statement: "A changed assessment judgment, improved instrumentation, recovered evidence, or scoring correction alone does not prove the assessed subject property changed."
    - id: K11
      statement: "Substantive improvement or regression requires comparability sufficient for the exact comparison claim plus evidence that the exact assessed property itself changed."
    - id: K12
      statement: "Change basis may be multi-causal; subject, observation, assessment-correction, standards, scope, process, market, or other explicitly represented bases may coexist."
    - id: K13
      statement: "Assessment history is attributable judgment history, not objective immutable maturity history; correction or supersession must remain distinguishable from substantive subject evolution."
    - id: K14
      statement: "No averages, percentages, weighted scores, synthetic overall score, implicit family scalar, or compensating aggregation may hide a material failure."
    - id: K15
      statement: "A judgment in one family does not automatically establish or negate a judgment in another family. Cross-family effect exists only when the exact assessed claim explicitly represents a semantic dependency on the other property."
    - id: K16
      statement: "Archetype labels are fixture packaging only and have no production applicability semantics."

scope:
  required_changes:
    - "Resolve exact TASK-0009 revision 1 and pinned agent-skills authority, refresh remote truth, and require live dev HEAD to equal the exact handoff base before mutation."
    - "Create exactly candidate/assessment_kernel/README.md, candidate/assessment_kernel/model.py, and candidate/assessment_kernel/test_model.py as the non-released candidate implementation surface."
    - "README.md must prominently identify the artifact as NON_RELEASED_CANDIDATE, authority NONE, generation NOT_ASSIGNED, state that frozen Generation 1 remains authoritative, and explain only the minimum semantics necessary to interpret the candidate model and tests."
    - "Implement a small dependency-free Python model/evaluator using explicit structured fields/enums/data rather than NLP, keyword heuristics, prose parsing, AI inference, fuzzy scoring, or open-ended semantic classification."
    - "Represent applicability, applicable-judgment, optional exception/disposition, immutable normative identity, typed/material subject context, attributable evidence references, explicit supported inference, explicit cross-claim dependency when needed, assessment/change basis, and trajectory facts only to the minimum extent required to make the authorized invariants deterministically testable."
    - "Do not create a universal domain schema. The candidate may accept claim-relative material context as explicit structured data and must preserve uncertainty when required material context/comparability is not established."
    - "Do not implement a generic claim-strength, evidence-strength, confidence, evidence-quality, family score, dimension score, overall score, weighted score, percentage, or maturity aggregation mechanism."
    - "Do not infer causal, regulatory, product, business, user, security, or other domain semantics from natural-language text. Tests must state those semantics explicitly as structured fixture facts."
    - "Use bounded test-driven implementation: establish failing focused regressions for the authorized attacks before or alongside the minimal implementation, then make only the smallest code necessary to pass them. Preserve causal ordering evidence in the Executor report where the execution surface permits it."
    - "Encode deterministic regressions for inference inflation, N/A gaming, synthetic aggregation absence/non-compensation, source-SHA-centric identity failure, knowledge-versus-maturity separation, false trajectory, cross-family non-substitution with explicit dependency behavior, multi-causal delta, exception laundering, historical correction/supersession, and archetype-label non-authority."
    - "Include at least one positive substantive-trajectory case where source revision is unchanged but an explicitly assessed property changes under sufficiently comparable context, and at least two negative cases where assessment output changes without proving subject improvement."
    - "Include a cross-family pair demonstrating that an independent transparency/expectation judgment can coexist with a separate Engineering security GAP, plus a second claim whose explicitly represented semantic dependency on security prevents an unsupported PASS."
    - "Keep the four prior archetype names, if used in test names or fixture grouping, out of model.py production applicability/control logic. No runtime branch may map an archetype name to applicability, family state, or maturity."
    - "Run the frozen Generation 1 validator/tests before and after candidate implementation and require them to remain passing without modification."
    - "After final implementation verification, commit and push the implementation on dev; then create, commit, and push only .agent/tasks/TASK-0009/report.yaml as the Executor-owned review evidence and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - README.md
    - STANDARD_MODEL.md
    - standards/manifest.yaml
    - standards/*.yaml
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
    - .agent/tasks/TASK-0008/*
    - .agent/tasks/TASK-0009/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Frozen Generation 1 semantic and enforcement artifacts are byte-for-byte unchanged by TASK-0009."
  - "standards/manifest.yaml remains generation 1 with exactly the existing 14 engineering dimensions."
  - "tools/validate.py remains the frozen V1 validator and is not retrofitted to understand candidate semantics."
  - "The candidate is not called Generation 2 and has no release, normative, product, family, or target-assessment authority."
  - "Candidate semantics are explicit structured facts; no NLP or heuristic semantic inference is introduced."
  - "Generation 1 flat PASS/PARTIAL/GAP/UNKNOWN/N/A/EXCEPTION semantics are not modified or reinterpreted by candidate representation choices."
  - "N/A remains factual non-applicability semantics; unknown applicability cannot be laundered into N/A."
  - "EXCEPTION remains non-PASS disposition semantics for an unmet applicable obligation in the candidate and never contributes maturity."
  - "Only PASS may satisfy an applicable maturity obligation."
  - "No maturity scalar or compensating aggregation is introduced."
  - "Exact normative identity, material subject identity/context, and attributable evidence identity remain distinguishable."
  - "Assessment knowledge increase is not subject maturity increase."
  - "Trajectory is exact-property-specific and evidence/comparability bound."
  - "Cross-family judgments do not substitute automatically; explicit semantic dependencies may constrain a dependent claim."
  - "Archetype labels never appear in production candidate applicability/control logic."
  - "No new dependency, parser, DSL, package framework, generator, CI, workflow, or release machinery is introduced."

forbidden_changes:
  - "Any mutation to README.md, STANDARD_MODEL.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, tests/test_validate.py, requirements-validator.txt, LICENSE, or other frozen Generation 1 authority/enforcement content."
  - "Any modification to TASK-0009/task.yaml by Executor."
  - "Any Generation 2 declaration, manifest, family registry, family standard, User/Product dimension, Business dimension, Service Operations dimension, lifecycle standard, maturity snapshot schema, released evidence taxonomy, or target assessment artifact."
  - "Any retrofit of the Generation 1 validator/tests to support the candidate."
  - "Any YAML/JSON/other DSL parser or schema subsystem for candidate semantics."
  - "Any NLP, LLM, keyword, regex-prose, or heuristic inference that guesses material claim semantics from natural-language text."
  - "Any generic confidence, evidence-strength, claim-strength, evidence-quality, weighted, percentage, point, family, dimension, or overall score."
  - "Any automatic cross-family substitution or archetype-to-applicability mapping."
  - "Any source-revision-change requirement for substantive trajectory."
  - "Any dependency change, CI/GitHub Actions change, branch creation, main mutation, promotion, tag, release, repository metadata mutation, or external publication."
  - "Any new file except candidate/assessment_kernel/README.md, candidate/assessment_kernel/model.py, candidate/assessment_kernel/test_model.py, and .agent/tasks/TASK-0009/report.yaml."
  - "Any TASK-0010 or later task, review.yaml, continuation artifact, or additional planning artifact created by Executor."

