structure_authority:
  status: RESOLVED
  source: "TASK-0009 revision 1 structure plus bounded Architect correction F-001"
  rationale: "No structural change is required. Correct only candidate/assessment_kernel/model.py, README.md, and test_model.py as necessary, then update the existing TASK-0009 report. No new file, dependency, parser, schema, or framework is authorized."

objective: "Correct the TASK-0009 Assessment Kernel Candidate trajectory semantics so substantive trajectory requires sufficient comparability and evidence that the exact assessed property changed, without additionally requiring one synthetic mandatory SUBJECT change-basis token; preserve every other accepted candidate boundary and frozen Generation 1 semantics."

revision_finding:
  id: F-001
  severity: material
  status: REPRODUCED
  evidence:
    - "candidate/assessment_kernel/model.py@40b962ab6313665bba0db4d57e58289726a67e83 rejects every trajectory lacking ChangeBasis.SUBJECT via subject_change_basis_missing."
    - "TASK-0009 revision 1 K11 requires sufficient comparability plus evidence that the exact assessed property changed; it does not require a SUBJECT basis token."
    - "TASK-0009 revision 1 K12 explicitly permits subject, observation, assessment-correction, standards, scope, process, market, or other represented change bases to coexist and does not designate SUBJECT as mandatory."
    - "candidate README currently states trajectory requires a subject-change basis, making the implementation-specific narrowing part of candidate-facing semantics."
  consequence: "A valid exact-property trajectory can be falsely rejected when the represented change basis is PROCESS, MARKET, or another material basis and the assessed property itself is demonstrably changed under sufficient comparability. This conflates proof of property change with a particular explanatory change-basis label."
  required_correction: "Remove the mandatory SUBJECT-basis condition from trajectory establishment and candidate documentation. Keep exact_property_changed plus sufficient comparability as the substantive gate, while preserving change_bases as explicit possibly multi-causal explanatory evidence."

scope:
  required_changes:
    - "Resolve exact TASK-0009 revision 2 and pinned agent-skills authority, refresh remote truth, and require live dev HEAD to equal the revision-2 handoff base before mutation."
    - "Re-read the exact revision-1 implementation and report evidence before editing; do not reopen unrelated candidate design."
    - "Use causal TDD for F-001: add at least one focused regression that currently fails because a substantive comparable trajectory with exact_property_changed=true and change_bases containing PROCESS and/or MARKET but not SUBJECT is rejected."
    - "Correct establish_trajectory so no particular ChangeBasis token is universally mandatory once exact comparability and exact-property change are established."
    - "Preserve change_bases in the trajectory result and allow multiple bases to coexist. A basis set containing only observation, assessment correction, standards change, or scope change must not by itself manufacture trajectory when exact_property_changed is false or comparability is insufficient."
    - "Update candidate README only as needed to remove the incorrect mandatory subject-change-basis statement and describe the corrected minimal trajectory gate."
    - "Preserve all other revision-1 candidate semantics: explicit structured inference support, fact-based applicability, PASS-only satisfaction, EXCEPTION disposition semantics, exact normative identity, attributable evidence, typed material subject context, cross-family non-substitution with explicit dependencies, no scalar/aggregation, no archetype production logic, and non-authoritative candidate identity."
    - "Run the focused candidate suite and frozen Generation 1 validator/tests on the exact final implementation state."
    - "Commit and push only the authorized implementation correction on dev, then update the existing .agent/tasks/TASK-0009/report.yaml to report_revision 2 with exact revision-2 evidence, commit/push it, and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - candidate/assessment_kernel/README.md
    - candidate/assessment_kernel/model.py
    - candidate/assessment_kernel/test_model.py
    - .agent/tasks/TASK-0009/task.yaml
    - .agent/tasks/TASK-0009/report.yaml
    - README.md
    - STANDARD_MODEL.md
    - standards/manifest.yaml
    - standards/*.yaml
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
  expected_files_are_restrictive: true

invariants:
  - "Frozen Generation 1 semantic and enforcement artifacts remain byte-for-byte unchanged."
  - "The Assessment Kernel Candidate remains NON_RELEASED_CANDIDATE / authority NONE / generation NOT_ASSIGNED."
  - "Trajectory establishment requires sufficient comparability and explicit proof that the exact assessed property changed."
  - "No individual ChangeBasis value, including SUBJECT, is universally required for trajectory establishment."
  - "Change bases are explicit explanatory context, may be multi-causal, and do not substitute for exact_property_changed or comparability."
  - "Assessment knowledge increase, evidence recovery, assessment correction, standards change, or score/status delta alone does not establish subject-property improvement."
  - "Source revision change remains unnecessary for substantive trajectory."
  - "All non-trajectory candidate semantics from revision 1 remain unchanged unless a concrete regression forces the minimum correction."
  - "No NLP, heuristic prose inference, new dependency, DSL, schema subsystem, scalar, aggregation, family definition, Generation 2 declaration, or archetype-driven production logic is introduced."

forbidden_changes:
  - "Any mutation to frozen Generation 1 authority/enforcement content including README.md, STANDARD_MODEL.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, tests/test_validate.py, requirements-validator.txt, or LICENSE."
  - "Any modification to TASK-0009/task.yaml by Executor."
  - "Any new file or directory."
  - "Any redesign of applicability, judgment, disposition, evidence, identity, dependency, aggregation, or family semantics unrelated to F-001."
  - "Any Generation 2 declaration, family/dimension design, lifecycle model, maturity snapshot, evidence taxonomy, target assessment artifact, validator retrofit, dependency, parser, framework, CI, or release machinery."
  - "Any branch creation, main mutation, promotion, tag, release, repository metadata mutation, or external publication."
  - "Any TASK-0010 or later task, review.yaml, or continuation artifact created by Executor."

