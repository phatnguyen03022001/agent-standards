      required: true
    - id: CHECK-7
      command_or_check: "Verify STANDARD_MODEL.md, README.md, standards/manifest.yaml, all standards/*.yaml, tools/validate.py, requirements-validator.txt, branch topology, main, tags, releases, and repository metadata remain unchanged; implementation mutation under revision 2, if any, is limited to tests/test_validate.py, followed by the canonical TASK-0004 report artifact."
      required: true
    - id: CHECK-8
