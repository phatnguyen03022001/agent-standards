    - id: CHECK-2
      command_or_check: "Inspect the exact revision-2 handoff-base tests/test_validate.py and determine whether the pre-existing candidate is bounded, deterministic, identity/property specific, and free of generalized semantic keyword inference. Record ADOPTED_UNCHANGED or CORRECTED_UNDER_REVISION_2 from fresh evidence only."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused final-state bounded regressions: unmodified frozen ASR-4.3/OBS-1.1 contracts PASS; the two seeded mutants are REJECTED; representative unrelated vague/static mutations do not cause the guards to claim generalized semantic classification."
      required: true
    - id: CHECK-4
      command_or_check: "python tools/validate.py"
      required: true
    - id: CHECK-5
      command_or_check: "python -m unittest discover -s tests -v"
      required: true
    - id: CHECK-6
