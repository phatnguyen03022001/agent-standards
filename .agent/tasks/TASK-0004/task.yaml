  - id: AC-1
    requirement: "F-001 is causally closed: the frozen pre-fix suite false-greens the seeded discretionary-predicate mutant, while the exact final revision-2 state deterministically rejects that mutant and accepts the unmodified frozen ASR-4.3 applicability contract without generalized natural-language parsing."
    evidence_required: "Fresh isolated pre-fix reproduction plus final-state focused mutation evidence."
  - id: AC-2
    requirement: "F-002 is causally closed: the frozen pre-fix suite false-greens the seeded artifact_inspection-only OBS-1.1 mutant, while the exact final revision-2 state deterministically rejects that mutant and accepts the unmodified frozen OBS-1.1 runtime evidence contract without generalized prose classification."
    evidence_required: "Fresh isolated pre-fix reproduction plus final-state focused mutation evidence."
  - id: AC-3
    requirement: "The final regression logic is explicit, deterministic, and bounded to the exact known frozen V1 identities/properties; representative unrelated mutations are not claimed to be generally classified."
    evidence_required: "Direct code inspection and bounded adversarial test evidence."
  - id: AC-4
    requirement: "Normative standards content, generic validator behavior, dependencies, repository structure, main, tags, releases, and metadata remain unchanged."
    evidence_required: "Exact blob/tree/ref and changed-file comparison against the frozen subject and revision-2 handoff base as applicable."
  - id: AC-5
    requirement: "All deterministic validation and tests pass on the exact final implementation state."
    evidence_required: "Exact final-state results from focused F-001/F-002 mutation tests, python tools/validate.py, full unittest discovery, and git diff --check."
  - id: AC-6
    requirement: "The report distinguishes fresh revision-2 evidence from stale revision-1 history and records whether the pre-existing candidate was adopted unchanged or corrected."
    evidence_required: "Canonical TASK-0004 report with exact base/final/report identities and explicit stale-candidate treatment."
  - id: AC-7
    requirement: "No promotion, release, later task, or unrelated assurance authority is created or exercised."
    evidence_required: "Fresh final refs/task-directory/tag/release inspection."

