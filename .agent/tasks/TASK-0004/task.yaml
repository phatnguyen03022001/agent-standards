structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0003 revision-2 report ownership judgment"
  rationale: "Both reproduced defects belong to bounded semantic regression assurance. Current dev already contains a stale pre-existing candidate change in tests/test_validate.py from invalidated TASK-0004 revision 1. Revision 2 may independently verify and adopt that content as current state, or minimally correct tests/test_validate.py if it does not satisfy this authority. No new module, schema, validator subsystem, or normative standards change is authorized."

objective: "Close only reproduced findings F-001 and F-002 under fresh durable authority by independently verifying, adopting when correct, or minimally correcting the pre-existing bounded regression candidate, without treating stale execution history as completion evidence or pretending to mechanically understand general natural-language semantics."

scope:
  required_changes:
    - "Inspect the pre-existing tests/test_validate.py content present at the exact revision-2 handoff base as untrusted current repository state, not as TASK-0004 completion evidence."
    - "Independently reproduce the pre-fix false-green behavior for F-001 and F-002 using an isolated copy of the frozen V1 pre-fix subject at 71f2be951c9d44452f5f53122f4062390ef4cb39 and its frozen tests/validator, rather than relying on the stale revision-1 execution claim."
    - "Independently verify whether the current pre-existing candidate closes F-001 by keeping frozen ASR-4.3 tied to its known-good factual applicability contract and deterministically rejecting the seeded discretionary-predicate mutant such as 'Where appropriate.'."
    - "Independently verify whether the current pre-existing candidate closes F-002 by keeping frozen OBS-1.1 tied to its known-good runtime-capable evidence contract and deterministically rejecting the seeded artifact_inspection-only mutant."
    - "Require the guards to remain identity/property bounded to known frozen V1 semantics. They must not infer arbitrary natural-language semantics from keywords or claim to classify unrelated requirements."
    - "If the pre-existing candidate already satisfies every revision-2 acceptance criterion, adopt it without recreating or cosmetically rewriting the same implementation. If it fails any criterion, modify only tests/test_validate.py with the smallest correction that closes F-001/F-002."
    - "Run the focused mutation checks and the complete deterministic repository validation/test suite on the exact final implementation state."
    - "Create, commit, and push .agent/tasks/TASK-0004/report.yaml containing fresh revision-2 execution evidence, including whether the pre-existing candidate was adopted unchanged or corrected under this authority."
  allowed_existing_files_or_components:
    - tests/test_validate.py
    - tools/validate.py
    - STANDARD_MODEL.md
    - README.md
    - standards/manifest.yaml
    - standards/assurance.yaml
    - standards/observability.yaml
    - standards/*.yaml
    - requirements-validator.txt
    - .agent/tasks/TASK-0003/report.yaml
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Frozen V1 normative meaning is unchanged."
  - "STANDARD_MODEL.md, README.md, standards/manifest.yaml, every standards/*.yaml file, tools/validate.py, and requirements-validator.txt are read-only for this task."
  - "The pre-existing f1db78b8c17c098054475b15707576d43dd34842 implementation commit is stale execution history and never becomes completion evidence merely because its content is present at the fresh base."
  - "Fresh revision-2 verification may adopt correct pre-existing content; adoption is a current evidence judgment, not retroactive validation of revision-1 lineage."
  - "F-001 closure must not be implemented as a generalized blacklist or keyword parser for words such as appropriate, relevant, applicable, documented, identified, or equivalent natural-language tokens."
  - "F-002 closure must not be implemented by guessing whether arbitrary requirement prose is runtime behavior from words such as runtime, emit, execute, operation, behavior, or equivalent tokens."
  - "Validator coverage must never pretend to exceed what is mechanically knowable."
  - "Known frozen semantic identities may be pinned deterministically in regression tests because V1 meaning is frozen; this does not create a general semantic parser."
  - "Representative unrelated mutations must demonstrate that the new guards do not claim generalized classification outside their exact bounded identities."
  - "An incorrect PASS must remain harder than an honest UNKNOWN."
  - "Semantic rigor is maximal; false-confidence tolerance is near zero; complexity budget is minimal."
  - "TASK-0003 NOT_REPRODUCED results remain NOT_REPRODUCED; this task must not relabel them clean or disproven."
  - "No future task, calibration authority, promotion authority, tag authority, or release authority is created by this task."

forbidden_changes:
  - "Any change to STANDARD_MODEL.md, README.md, standards/manifest.yaml, any standards/*.yaml file, tools/validate.py, requirements-validator.txt, dependency metadata, or repository metadata."
  - "Any new DSL, policy engine, schema layer, semantic parser, NLP/AI validator, registry, framework, service, workflow, or generalized rule engine."
  - "Any attempt to solve F-001 through a broad natural-language keyword blacklist or to solve F-002 through generic prose classification."
  - "Any unrelated semantic coverage expansion beyond the two reproduced findings."
  - "Any new source/test/helper file; bounded helpers must remain inside tests/test_validate.py if needed."
  - "Any rewrite, revert, cherry-pick, or history surgery performed merely to make the stale revision-1 implementation look as though it originated under revision 2."
  - "Any TASK-0005 or later task artifact or authority."
  - "Any branch creation, merge, rebase, reset, force update, main mutation, promotion, tag, release, issue mutation, pull-request mutation, or repository metadata mutation."
  - "Any claim that stale TASK-0004 revision-1 execution evidence itself satisfies revision-2 acceptance."

