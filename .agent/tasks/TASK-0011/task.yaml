  expected_files_are_restrictive: true

invariants:
  - "The Assessment Kernel Candidate remains NON_RELEASED_CANDIDATE with authority NONE and generation NOT_ASSIGNED throughout this task."
  - "Frozen Generation 1 remains the only released/normative standards authority and is byte-for-byte unchanged."
  - "Candidate README/model/tests remain byte-for-byte unchanged."
  - "A red-team finding is advisory evidence, not Architect judgment, task authority, canonical standard, or permission to implement a fix."
  - "Evidence must support the exact semantics, scope, and inference asserted; the kernel must not accept a materially stronger inference than the supplied/established evidence warrants."
  - "Applicability is factual; unknown applicability is not N/A."
  - "PASS-only satisfaction remains distinct from PARTIAL, GAP, UNKNOWN, NOT_APPLICABLE/N/A, and EXCEPTION semantics."
  - "EXCEPTION is never PASS and never contributes satisfaction/maturity."
  - "No family scalar or synthetic overall score is introduced or demanded."
  - "Dimension scalar is not presumed where no defensible cumulative ordinal ladder exists."
  - "Assessment history is attributable judgment history, not objective subject history."
  - "Assessment delta does not itself prove subject trajectory."
  - "Trajectory requires sufficient comparability and evidence of exact-property change; change basis may be multi-causal and no individual basis token is universally required."
  - "Cross-family or cross-claim evidence does not substitute for another obligation unless an explicit semantic dependency is validly established."
  - "Subject identity is material, typed, and claim-relative; unknown material context preserves uncertainty rather than manufacturing exact identity."
  - "No universal mega-schema, global ontology, generic evidence-strength score, confidence score, aggregation score, or family design is introduced by this task."

forbidden_changes:
  - "Any modification to candidate/assessment_kernel/*, README.md, STANDARD_MODEL.md, standards/*, tools/*, tests/*, requirements-validator.txt, LICENSE, or any existing task/report."
  - "Any implementation of a discovered fix."
  - "Any new test, probe, fixture, script, or code file inside the repository."
  - "Any TASK-0012 or later task, review.yaml, continuation artifact, lifecycle framework, family schema, generation declaration, or canonical kernel artifact."
  - "Any .gitignore, dependency, CI/GitHub Actions, branch, main, promotion, tag, release, repository metadata, agent-runtime, runtime profile, or external publication mutation."
  - "Any family-level, overall, weighted, averaged, percentage, point, confidence, claim-strength, or generic evidence-strength scoring system."
  - "Any assumption that identical source revision proves subject identity or lack of substantive change."
  - "Any universal requirement that ChangeBasis.SUBJECT must be present for trajectory."

