      required: true
    - id: CHECK-2
      command_or_check: "Require current candidate README/model/test blobs equal 249dda376432473c153ed4311df36c8a629935b7 / 9fd60367418de951cd9488088f402a817dc0914c / 4a9dc6a91277390299d2873b39d9faaf827754f3 before analysis."
      required: true
    - id: CHECK-3
      command_or_check: "Run isolated executable probes for every behaviorally testable mandatory attack; record minimal inputs and actual outputs without modifying repository content."
      required: true
    - id: CHECK-4
      command_or_check: "Run python -B -m unittest discover -s candidate/assessment_kernel -p 'test_*.py' -v and require 12/12 PASS."
      required: true
    - id: CHECK-5
      command_or_check: "Run the current repository-owned Generation 1 verification entrypoint and require PASS while preserving a clean/no-cache exact subject state as required by current repo authority."
      required: true
    - id: CHECK-6
      command_or_check: "Before report commit, require the only repository change is .agent/tasks/TASK-0011/report.yaml and refresh refs for staleness."
      required: true
    - id: CHECK-7
      command_or_check: "After report push require dev equals the enclosing report commit, its sole parent is the handoff base, report commit changes only .agent/tasks/TASK-0011/report.yaml, main remains frozen Generation 1, and branches remain exactly {dev, main}."
      required: true
  authoritative_verification:
