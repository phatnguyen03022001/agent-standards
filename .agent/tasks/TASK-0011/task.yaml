acceptance_criteria:
  - id: AC-1
    requirement: "The exact implemented candidate is independently attacked, not merely re-reviewed from TASK-0009 prose."
    evidence_required: "Exact candidate blob identity plus executable/source-level adversarial probes tied to concrete behavior."
  - id: AC-2
    requirement: "Mandatory attack classes are explicitly resolved: evidence identity, assessment/claim identity, dependency laundering, invalid-assessment trajectory, conflicting subject context, trusted trajectory inputs, applicability/N/A, exception laundering, inference binding, and aggregation absence."
    evidence_required: "Per-attack result with minimal reproduction and one of MATERIAL/NON_MATERIAL/DESIGN_OPTION/NOT_REPRODUCED."
  - id: AC-3
    requirement: "Findings distinguish implementation defects from legitimate trusted-input boundaries and do not demand speculative framework machinery."
    evidence_required: "Each MATERIAL finding identifies a violated stated invariant or materially unsafe accepted state; rejected concerns include rationale."
  - id: AC-4
    requirement: "TASK-0009 F-001 remains closed and trajectory semantics are not regressed during red-team reasoning."
    evidence_required: "Positive no-SUBJECT trajectory case still establishes when comparability and exact-property change are true; distinct negative trajectory cases remain rejected."
  - id: AC-5
    requirement: "Existing candidate and frozen Generation 1 verification remain passing without repository content mutation."
    evidence_required: "Candidate focused suite 12/12 PASS under explicit -B and current repository-owned Generation 1 verification PASS on exact subject state."
  - id: AC-6
    requirement: "The report is useful for Architect adjudication without self-authorizing remediation."
    evidence_required: "Final prioritized finding table, minimal reproduction/evidence, consequence, classification, and explicit NEEDS_REVIEW result; no fix implementation or canonicalization."
  - id: AC-7
    requirement: "Execution remains report-only and repository-local."
    evidence_required: "Exact post-push compare from handoff base changes only .agent/tasks/TASK-0011/report.yaml; main and branch topology remain unchanged."

