finding_classification:
  required:
    - MATERIAL
    - NON_MATERIAL
    - DESIGN_OPTION
    - NOT_REPRODUCED
  rule: "Do not label a preference, hypothetical future extension, or trusted-input design choice as MATERIAL unless a concrete accepted/established state violates a stated candidate invariant or permits a materially stronger inference than the evidence supports."

scope:
  required_changes:
    - "Resolve exact TASK-0011 revision 1 and pinned agent-skills authority, refresh remote truth, and require live dev HEAD to equal the exact handoff base before any repository mutation."
    - "Resolve the exact candidate subject by Git object identity. Require candidate README/model/test blobs at current dev to equal the review_subject blobs above. If candidate identity differs, stop STALE_STATE rather than auditing a different artifact."
    - "Treat this as an independent red-team. Do not assume TASK-0009 Architect acceptance proves semantic correctness. Attempt to make the candidate accept invalid states, overstate inference, erase material distinctions, or establish trajectory/dependency/evidence claims without sufficient attributable structure."
    - "Use executable probes in an isolated disposable workspace whenever behavior can be tested deterministically. Do not modify candidate files in the repository. Temporary adversarial scripts/fixtures may exist only outside the target repository and must not become durable repo artifacts."
    - "For every candidate finding, provide: exact invariant/property attacked, minimal reproducible input, actual behavior, expected safe behavior, consequence, classification, and whether the issue is implementation-specific, model-level, or merely an explicit trust-boundary/design option."
    - "Actively test whether attributable evidence can be accepted with missing or empty identity information, including EvidenceRef.identifier or equivalent fields. Determine whether empty identity materially violates attribution semantics or is intentionally delegated to a trusted caller."
    - "Actively test whether assessment/claim/family identifiers can be empty or otherwise structurally non-identifying while an assessment is accepted. Distinguish cosmetic labels from identities needed to bind judgments and dependencies."
    - "Actively attack cross-claim dependency semantics. Determine whether a caller can mark a dependency satisfied without binding the referenced dependency to an actual assessment identity, normative authority, evidence, or compatible subject context, thereby laundering one claim through another."
    - "Actively attack trajectory establishment with structurally invalid before/after assessments. Determine whether establish_trajectory or equivalent can establish trajectory merely from matching identifiers plus caller booleans even when either assessment would fail the candidate's own evaluation/validation rules."
    - "Actively attack material subject identity context for duplicate/conflicting keys or equivalent ambiguity. Determine whether contradictory values for the same material context dimension can pass required-context checks and make exact claim identity ambiguous."
    - "Probe the trust boundary around comparability, exact_property_changed, direction, and change_bases. These may be legitimate trusted structured inputs. Classify as MATERIAL only if candidate documentation/invariants claim the kernel itself establishes those facts or if the API can produce a stronger conclusion than its declared trust boundary permits. Otherwise classify as DESIGN_OPTION or NON_MATERIAL with rationale."
    - "Probe whether evidence support is bound tightly enough to exact semantics/scope/inference to uphold the candidate's inference invariant. Do not demand a universal evidence-strength/confidence score."
    - "Probe applicability states, including UNKNOWN and NOT_APPLICABLE, for accidental PASS-equivalence, maturity contribution, evidence contradictions, or N/A gaming. Preserve the distinction between factual non-applicability and incomplete knowledge."
    - "Probe exception semantics for laundering: EXCEPTION must remain a non-PASS disposition and must not satisfy a maturity-bearing obligation."
    - "Probe no-aggregation behavior. Do not criticize the absence of an overall score; instead attempt to find any existing code path that implicitly compensates, averages, or compresses material failures."
    - "Re-run and specifically preserve the closed TASK-0009 F-001 trajectory behavior: comparability + exact-property change may establish trajectory without requiring ChangeBasis.SUBJECT; knowledge/correction-only and insufficient-comparability negatives remain rejected. Do not reintroduce SUBJECT as a universal gate."
    - "Run the exact candidate focused suite with bytecode suppression and require its existing 12 regressions remain PASS. Run repository-owned Generation 1 verification as current repo authority requires and require it remains PASS; this assurance task must not mutate either artifact family."
    - "Search for additional minimal counterexamples beyond the mandatory probes. Prefer one decisive counterexample over a long list of speculative concerns. Stop expanding an attack once the semantic issue is already proven."
    - "Do not design User/Product, Business, or Service Operations families. You may note only whether a kernel behavior would constrain future independent families incorrectly."
    - "Produce only .agent/tasks/TASK-0011/report.yaml as durable Executor evidence. Commit and push that report on dev, verify it is the sole Executor content change from the handoff base, and stop at the Architect review boundary with NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - candidate/assessment_kernel/README.md
    - candidate/assessment_kernel/model.py
    - candidate/assessment_kernel/test_model.py
    - README.md
    - STANDARD_MODEL.md
    - standards/manifest.yaml
    - standards/*.yaml
