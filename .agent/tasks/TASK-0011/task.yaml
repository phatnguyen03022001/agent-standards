blocking_decisions:
  - "If dev/main/branch topology, task identity, pinned skills, or candidate blobs drift before mutation, stop STALE_STATE."
  - "If deterministic Python execution is unavailable, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before report mutation."
  - "If a discovered issue requires changing candidate or V1 content to determine whether it is valid, report the uncertainty and stop at review; do not implement exploratory fixes in-repo."
  - "If a mandatory attack cannot be executed because the required evidence surface is unavailable, distinguish NOT_REPRODUCED from CURRENT_PHASE_CAPABILITY_UNAVAILABLE according to whether the capability is required by task acceptance."
  - "No discovered finding authorizes remediation, candidate canonicalization, family design, main mutation, promotion, tag, or release."

execution_ready: true
