objective: "Independently attempt to falsify the exact implemented Assessment Kernel Candidate through executable adversarial probes and source-level reasoning, identify only reproducible material defects or bounded design limitations, distinguish trusted-input boundaries from missing invariants, and report evidence without implementing fixes, canonicalizing a new generation, designing standards families, or changing frozen Generation 1."

