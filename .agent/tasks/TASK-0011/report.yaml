findings:
  - id: F-001
    classification: MATERIAL
    title: "Evidence references can support a satisfied PASS without evidence identity"
    invariant_attacked: "Attributable evidence references must support the exact asserted inference; assessment evidence must remain attributable rather than anonymous."
    minimal_reproduction: "Evaluate an otherwise valid applicable PASS whose sole EvidenceRef has identifier='' and supported_inferences={'observed_outcome'}."
    actual_behavior: "accepted=true, obligation_satisfied=true, reasons=[]"
    expected_safe_behavior: "An anonymous evidence reference cannot establish attributable support for a satisfied obligation; the assessment must remain unresolved or rejected."
    consequence: "A caller can obtain an accepted satisfied PASS while the purported supporting evidence cannot be identified or traced, violating the candidate's attributable-evidence boundary."
    issue_scope: model_level
    counterevidence: "Inference membership itself is checked exactly; replacing the supported inference with an undeclared stronger inference is rejected. The defect is evidence attribution identity, not the exact-string inference check."

  - id: F-002
    classification: MATERIAL
    title: "Assessment, claim, family, and other semantic identity tokens are not validated as identifying values"
    invariant_attacked: "Assessment history is attributable judgment history; cross-family judgments remain independent; normative/subject identity must be material and identifying."
    minimal_reproduction: "Independently set assessment_id='', claim_id='', or family='' on an otherwise valid applicable PASS. A separate probe used whitespace-only authority/subject identity and a whitespace asserted inference with matching evidence support."
    actual_behavior: "Each empty assessment_id/claim_id/family probe returned accepted=true and obligation_satisfied=true. Whitespace-only authority/subject/inference tokens also produced accepted=true and obligation_satisfied=true."
    expected_safe_behavior: "Identity-bearing fields needed to attribute an assessment, claim, family, normative authority, subject, or asserted inference must be structurally identifying rather than empty or whitespace-only."
    consequence: "Accepted judgments can lose the identities needed to bind history, claim ownership, family separation, normative authority, subject attribution, and semantic inference. This permits ambiguous or collapsed identities while still yielding PASS satisfaction."
    issue_scope: model_level
    counterevidence: "NormativeAuthority with literal empty strings and SubjectIdentity with literal empty kind/identifier are rejected; the gap is incomplete identity validation and absence of validation for assessment_id/claim_id/family."

  - id: F-003
    classification: MATERIAL
    title: "Caller-asserted dependency satisfaction can launder an unbound cross-claim dependency"
    invariant_attacked: "Cross-family or cross-claim evidence must not substitute for another obligation unless an explicit semantic dependency is validly established."
    minimal_reproduction: "Evaluate an otherwise valid applicable PASS with dependencies=(Dependency('engineering.security', satisfied=True),) without supplying any referenced dependency assessment, authority, subject context, evidence, or compatible claim identity. A second probe used Dependency('', satisfied=True)."
    actual_behavior: "Both probes returned accepted=true and obligation_satisfied=true with no reasons."
    expected_safe_behavior: "A dependency that contributes to acceptance must be bound to enough actual dependency identity/state to establish that the referenced obligation exists and is satisfied in a compatible context, or must remain unresolved."
    consequence: "A caller can convert an arbitrary boolean into dependency satisfaction and obtain a PASS for a dependent claim even when the referenced claim is absent, unidentified, failed, differently scoped, or differently authoritative."
    issue_scope: model_level
    counterevidence: "Dependency(..., satisfied=False) is correctly rejected as unmet_dependency. The material gap is that satisfied=True is trusted without any binding structure despite the candidate invariant requiring a validly established semantic dependency."

  - id: F-004
    classification: MATERIAL
    title: "Trajectory can be established from assessments that the candidate itself rejects"
    invariant_attacked: "Evidence must support the exact semantics/scope/inference asserted; assessment delta alone does not prove subject trajectory; trajectory is an evidence-bearing conclusion over attributable assessments."
    minimal_reproduction: "Construct before and after assessments with evidence=() and asserted_inference='' so evaluate(before) and evaluate(after) each reject with missing_evidence and missing_asserted_inference; then call establish_trajectory with matching claim/family/authority/subject plus comparable=true and exact_property_changed=true."
    actual_behavior: "Both assessments evaluated accepted=false, but establish_trajectory returned established=true, direction=IMPROVEMENT, reasons=[]."
    expected_safe_behavior: "A trajectory conclusion must not be established from structurally invalid/unaccepted assessment records unless the API explicitly represents a separate validated trajectory evidence source that does not depend on those records."
    consequence: "The kernel can emit a stronger historical conclusion from records that fail its own attribution/evidence acceptance rules, allowing invalid assessment snapshots to anchor an established improvement/regression."
    issue_scope: model_level
    counterevidence: "When comparable=false or exact_property_changed=false, trajectory is correctly rejected. The defect is independent of those trusted facts: invalid assessment records are never gated."

  - id: F-005
    classification: MATERIAL
    title: "Contradictory duplicate material-context keys satisfy subject identity requirements"
    invariant_attacked: "Subject identity is material, typed, and claim-relative; unknown or ambiguous material context must preserve uncertainty rather than manufacture exact identity."
    minimal_reproduction: "Use SubjectIdentity(kind='service', identifier='svc-1', material_context=(('environment','prod'),('environment','staging'),('population','cohort-a')), required_context=('environment','population'))."
    actual_behavior: "has_required_context=true; an otherwise valid applicable PASS evaluates accepted=true and obligation_satisfied=true."
    expected_safe_behavior: "Conflicting values for one material identity dimension must be rejected or preserved as ambiguous/unknown; mere presence of the key must not satisfy exact context."
    consequence: "Contradictory material context can be treated as complete exact-enough subject identity, enabling judgments to bind to an ambiguous subject while reporting PASS satisfaction."
    issue_scope: model_level
    counterevidence: "A genuinely missing required context key is correctly rejected as missing_material_context. The gap is duplicate/conflicting-key ambiguity."

mandatory_attack_resolution:
  - attack: evidence_identity
    classification: MATERIAL
    finding: F-001
    evidence: "Empty EvidenceRef.identifier accepted and satisfied."
  - attack: assessment_claim_family_identity
    classification: MATERIAL
    finding: F-002
    evidence: "Empty assessment_id, claim_id, and family independently accepted and satisfied; whitespace-only identity/inference tokens also accepted when truthy."
  - attack: cross_claim_dependency_laundering
    classification: MATERIAL
    finding: F-003
    evidence: "satisfied=True accepted without a referenced dependency assessment or compatible binding."
  - attack: invalid_assessment_trajectory
    classification: MATERIAL
    finding: F-004
    evidence: "Two evaluate()-rejected snapshots still established IMPROVEMENT when trusted trajectory facts were true."
  - attack: conflicting_subject_context
    classification: MATERIAL
    finding: F-005
    evidence: "Conflicting duplicate environment values satisfy required context and permit PASS."
  - attack: trusted_trajectory_inputs
    classification: DESIGN_OPTION
    finding: ""
    evidence: "A changed material_context can still establish trajectory when caller explicitly supplies comparable=true and exact_property_changed=true. TASK-0011 explicitly permits comparability, exact_property_changed, direction, and change_bases as trusted structured inputs. No stronger kernel claim was reproduced beyond those supplied facts."
  - attack: inference_binding
    classification: NON_MATERIAL
    finding: ""
    evidence: "Exact asserted-inference membership is enforced. An inference not listed by any evidence reference is rejected as unsupported_inference. The semantic truth of supported_inferences is an explicit trusted-input boundary rather than a kernel-derived confidence claim. F-001 separately covers missing evidence identity."
  - attack: applicability_na_laundering
    classification: NOT_REPRODUCED
    finding: ""
    evidence: "UNKNOWN and NOT_APPLICABLE remain distinct applicability values; each can be accepted as a factual record with judgment=None but neither satisfies an obligation."
  - attack: exception_laundering
    classification: NOT_REPRODUCED
    finding: ""
    evidence: "EXCEPTION on GAP/PARTIAL/UNKNOWN remains non-satisfying; EXCEPTION wrapping PASS is rejected with exception_cannot_wrap_pass."
  - attack: synthetic_aggregation
    classification: NOT_REPRODUCED
    finding: ""
    evidence: "No aggregate/score/overall_score/family_score/dimension_score/maturity_score/percentage public API was found, and the existing no-aggregation regression passes."
  - attack: task_0009_f001_trajectory_regression
    classification: NOT_REPRODUCED
    finding: ""
    evidence: "A PROCESS-only change basis with comparable=true and exact_property_changed=true still establishes trajectory without ChangeBasis.SUBJECT; exact_property_changed=false and comparable=false negatives remain rejected."

