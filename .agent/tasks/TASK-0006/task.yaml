structure_authority:
  status: RESOLVED
  source: "TASK-0006 final-assurance boundary"
  rationale: "The exact V1 candidate is read-only. The only Executor-owned repository mutation authorized is .agent/tasks/TASK-0006/report.yaml and its commit/push. No implementation, normative, validator, test, dependency, topology, metadata, promotion, tag, release, or future-task mutation is authorized."

objective: "Perform the final independent exact-candidate V1 assurance gate on the current accepted candidate, proving no material semantic/calibration blocker, unresolved material UNKNOWN, lineage/drift defect, deterministic verification failure, or known-regression reopening remains before the Governing Architect may separately consider promotion and release authority."

scope:
  required_changes:
    - "Audit the exact pre-task V1 release candidate at a40801382740131a3069212a37d8abf20421956f. The TASK-0006 planning commit is not part of the assurance subject."
    - "Re-establish exact identity of STANDARD_MODEL.md, README.md, standards/manifest.yaml, all 14 standards/*.yaml files, tools/validate.py, tests/test_validate.py, requirements-validator.txt, and accepted TASK-0003/TASK-0004/TASK-0005 report artifacts."
    - "Verify that semantic/normative/validator content has not drifted since the accepted TASK-0004/TASK-0005 subjects except for the already accepted bounded tests/test_validate.py remediation and later task/report artifacts."
    - "Independently inspect accepted lineage: TASK-0003 revision 2 durable audit evidence, TASK-0004 revision 2 durable remediation evidence, TASK-0005 revision 1 durable calibration evidence, and the superseded/stale TASK-0004 revision-1 execution history. Confirm no stale execution claim is being treated as accepted completion evidence."
    - "Run deterministic verification on a run-owned isolated materialization of the exact assurance subject: python tools/validate.py, python -m unittest discover -s tests -v, and git diff --check or a logically equivalent exact-tree whitespace/diff check."
    - "Re-run the two known regression challenges causally: on the frozen pre-remediation V1 subject at 71f2be951c9d44452f5f53122f4062390ef4cb39 each seeded F-001/F-002 mutant must still false-green through the original bounded assurance path, while on the exact current candidate the bounded ASR-4.3 and OBS-1.1 guards must reject those same mutants and accept the unmodified current corpus."
    - "Re-check that TASK-0004 guards remain exact identity/property bounded and do not claim generalized semantic knowledge, target applicability profiles, or unrelated requirement classification."
    - "Reconcile TASK-0003 and TASK-0005 epistemic state without whitewashing: historical F-001/F-002 remain REPRODUCED history; current reopened-regression attacks may be NOT_REPRODUCED only if fresh exact evidence fails to reproduce a reopening. NOT_REPRODUCED is never clean/disproven."
    - "Review current release-shape prerequisites read-only: exact branch topology, current dev/main identities, existing tags, existing GitHub releases, task namespace, and absence of conflicting release identity. Do not mutate any of them."
    - "Classify every material final-gate attack as REPRODUCED, NOT_REPRODUCED, or UNKNOWN. Any material REPRODUCED blocker or material UNKNOWN makes the final result NOT_RELEASE_READY."
    - "Create, commit, and push only .agent/tasks/TASK-0006/report.yaml containing complete exact-candidate evidence and a bounded RELEASE_READY or NOT_RELEASE_READY conclusion. RELEASE_READY is only an assurance judgment; it does not authorize promotion, tag creation, GitHub Release publication, or metadata mutation."

  allowed_existing_files_or_components:
    - STANDARD_MODEL.md
    - README.md
    - standards/manifest.yaml
    - standards/*.yaml
    - tools/validate.py
    - tests/test_validate.py
