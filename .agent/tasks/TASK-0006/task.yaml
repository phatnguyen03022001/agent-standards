  - id: AC-2
    requirement: "Accepted TASK-0003/TASK-0004/TASK-0005 lineage is reconciled and stale TASK-0004 revision-1 execution history is not treated as current completion evidence."
    evidence_required: "Exact task/report SHAs, parent/changed-path lineage where material, and an explicit stale-history treatment statement."
  - id: AC-3
    requirement: "All deterministic repository verification passes on an isolated materialization of the exact assurance subject."
    evidence_required: "Exact outputs/results for validator, full unittest suite, and diff/whitespace verification tied to the exact subject."
  - id: AC-4
    requirement: "Known F-001/F-002 regressions remain causally demonstrated on the frozen pre-remediation subject and remain closed on the exact current candidate with bounded guards."
    evidence_required: "Fresh old-subject false-green reproduction, current-candidate unmodified PASS, exact seeded-mutant rejection, and direct boundedness inspection."
  - id: AC-5
    requirement: "No material semantic/calibration attack reopening or material UNKNOWN remains on the exact final candidate."
    evidence_required: "Final-gate attack matrix using only REPRODUCED/NOT_REPRODUCED/UNKNOWN and preserving historical epistemic state."
  - id: AC-6
    requirement: "Release-shape prerequisites are inspected read-only with no conflicting existing release identity and no unauthorized mutation."
    evidence_required: "Fresh refs/topology/tags/releases/task-namespace evidence and explicit mutation boundary verification."
  - id: AC-7
    requirement: "The only Executor repository mutation is the canonical TASK-0006 report commit."
    evidence_required: "Fresh post-push compare showing exactly one report commit/changed path relative to the handoff base and no other ref/content mutation."
  - id: AC-8
    requirement: "Final conclusion is RELEASE_READY only when no material reproduced blocker, material UNKNOWN, deterministic verification failure, lineage defect, drift ambiguity, or conflicting release identity remains."
    evidence_required: "A final bounded release-assurance conclusion with explicit statement that promotion/tag/release remain separately unauthorized."

