structure_authority:
  status: RESOLVED
  source: "TASK-0003 read-only audit boundary"
  rationale: "Execution creates no repository files and changes no repository content, refs, metadata, release state, dependencies, schemas, validators, tests, or normative standards. The only planning mutation is this Architect-owned task artifact committed before handoff."

objective: "Perform an independent extreme semantic and adversarial assurance audit of frozen V1 so an incorrect PASS is materially harder than an honest UNKNOWN, without increasing mechanism complexity or manufacturing future work."

scope:
  required_changes:
    - "Perform a read-only semantic-first, adversarial-first audit of the exact frozen V1 corpus at 71f2be951c9d44452f5f53122f4062390ef4cb39."
    - "Attack the normative model and derived enforcement for definitions that are validator-valid but model-invalid, especially applicability, N/A, EXCEPTION, evidence sufficiency, independence, cumulative levels, Level 4/5 scope, cross-dimension ownership, external constraints, identity/revision attribution, and anti-gaming semantics."
    - "Audit all 14 dimensions and Levels 0-5 for meaningful progression, non-vacuous assurance, accidental overlap, missing material engineering properties, mechanism prescription, and evidence obligations that fail to prove the claim they support."
    - "Attempt concrete adversarial cases including vague or discretionary applicability, fake N/A, target-controlled scope labels, UNKNOWN converted to N/A or PASS, weak static evidence for runtime behavior, circular or stale evidence, self-attested independence, duplicate controls, compound controls hiding independently fail-able properties, lower-level blockers bypassed by stronger-looking higher-level evidence, and omitted external constraints."
    - "Explicitly challenge the two current candidate exploit classes: a syntactically valid but non-factual applicability predicate such as 'Where appropriate.', and a runtime-behavior claim whose evidence classes permit only static artifact inspection. Do not presume either candidate is a confirmed defect; classify only from reproduced evidence."
    - "Use synthetic target archetypes only as adversarial fixtures to expose semantic exploits. Never treat an archetype name as an applicability profile or as evidence that a dimension is automatically applicable or N/A."
    - "For every material attack attempted, classify the epistemic result exactly as REPRODUCED, NOT_REPRODUCED, or UNKNOWN. REPRODUCED requires a concrete exploit demonstration attributable to the exact audit subject. NOT_REPRODUCED means the attack was attempted and no exploit was demonstrated; it does not mean disproven or clean. UNKNOWN means evidence or capability is insufficient to determine the semantics safely and must never be converted to PASS."
    - "For each REPRODUCED finding state the violated normative rule, concrete exploit, reproduction evidence, material consequence, correct owning layer, and only a minimal closure direction sufficient to bound owner and scope. Do not propose implementation patches or future task authority."
    - "For each material UNKNOWN state exactly what evidence is missing, why the uncertainty matters, and whether that uncertainty is material enough to block V1 release assurance."
    - "Assess validator fidelity conservatively: machine-checkable invariants may be demanded from the validator, but validator coverage must never pretend to exceed what is mechanically knowable. Mechanically unknowable semantic requirements remain enforceable through the appropriate review or assurance layer rather than through brittle keyword heuristics."
    - "Return the complete audit evidence and conclusion to the Governing Architect without mutating the repository."
  allowed_existing_files_or_components:
    - STANDARD_MODEL.md
    - README.md
    - standards/manifest.yaml
    - standards/*.yaml
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
    - .agent/tasks/TASK-0001/*
    - .agent/tasks/TASK-0002/*
    - .agent/tasks/TASK-0003/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Audit subject is the exact V1 standards content at 71f2be951c9d44452f5f53122f4062390ef4cb39; the planning commit containing TASK-0003 does not change that semantic subject."
  - "Semantic rigor is maximal; false-confidence tolerance is near zero; complexity budget is minimal."
  - "An incorrect PASS must be harder to obtain than an honest UNKNOWN."
  - "Not reproduced is not disproven and is not clean."
  - "Only a concretely REPRODUCED finding is eligible to justify downstream fix authority; this task creates no downstream authority itself."
  - "A material UNKNOWN may block V1 release assurance but does not manufacture implementation work without later Architect judgment and fresh authority."
  - "Level 5 requires exceptional assurance evidence. Rarity is an expected consequence, never a quota or calibration target."
  - "Synthetic archetypes are adversarial fixtures only; applicability remains derived from observable target facts and normative rules."
  - "Validator enforcement must be no stronger than mechanically defensible knowledge and no weaker than mechanically enforceable normative invariants."
  - "Machine-checkable syntax and structure belong in deterministic validation; semantic sufficiency remains a review/assurance judgment where mechanical proof is not defensible."
  - "agent-standards owns what good engineering properties, evidence, and maturity mean. It does not own product/design documentation completeness, workflow, target architecture, domain truth, target profiles, or build-versus-buy decisions."
  - "Build-versus-buy remains an Architect/target trade-off. The standard judges resulting engineering properties and evidence and does not universally prescribe reuse, SaaS, open source, or in-house implementation."
  - "Do not infer release readiness from validator PASS, test PASS, prior promotion, frozen wording, or absence of reproduced findings in an incomplete audit."

forbidden_changes:
  - "Any mutation to STANDARD_MODEL.md, README.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, tests, dependencies, or any other repository content during audit execution."
  - "Any report.yaml, review.yaml, continuation artifact, fix artifact, future task artifact, proposed patch, implementation commit, or audit-result commit."
  - "Any branch creation, ref mutation, commit, push, promotion, merge, rebase, reset, force update, tag, release, repository metadata mutation, issue creation, or pull request mutation."
  - "Any pre-created TASK-0004 or later task authority, roadmap-created work, fix authorization, promotion authority, or release authority."
  - "Any DSL, policy engine, NLP validator, AI validator, schema layer, registry, framework, service, database, workflow engine, or other machinery introduced merely to make semantic review look automated."
  - "Any statistical quota or target for how many repositories may reach Level 5."
  - "Any implicit applicability profile derived from labels such as tiny CLI, web service, payment system, distributed system, or safety-critical system."
  - "Any import of agent-documents documentation obligations or agent-skills workflow rules into the normative engineering standards model."
  - "Any universal build-versus-buy prescription."
  - "Any claim that a semantic rule is clean merely because the current validator cannot mechanically decide it."

gap_policy:
  local_auto_fix: false
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

structure_policy:
  expected_new_files: []
  unlisted_new_files:
    allowed: false
    max: 0
    within: []
    purpose: "Read-only audit; no execution artifact is created in the repository."
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

continuation_policy:
  mode: MANUAL
  stop_conditions:
    - BLOCKED
    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

capability_requirements:
  EXECUTION:
    - exact_remote_ref_read
    - repository_content_read

acceptance_criteria:
  - id: AC-1
    requirement: "The audit covers the normative semantics in STANDARD_MODEL.md, the 14-dimension registry, every standards/*.yaml dimension, validator fidelity, and regression-test fidelity on the exact frozen V1 subject."
    evidence_required: "A coverage matrix or equivalent explicit evidence showing every dimension and every material semantic attack family was examined, with no silent omission."
  - id: AC-2
    requirement: "Every material attack result is classified exactly as REPRODUCED, NOT_REPRODUCED, or UNKNOWN using the task epistemic semantics."
    evidence_required: "Per-attack reproduction evidence or attempted-attack evidence, with missing evidence stated for every UNKNOWN."
  - id: AC-3
    requirement: "Every REPRODUCED finding demonstrates a concrete exploit against the exact frozen V1 subject and identifies the violated normative rule, consequence, owning layer, and minimal closure direction without proposing a patch or future task authority."
    evidence_required: "Direct exact-revision artifact/code evidence and, where materially useful and available without target mutation, isolated deterministic reproduction."
  - id: AC-4
    requirement: "Applicability, N/A, EXCEPTION, evidence-class causality, independence, cumulative maturity, non-vacuous Level 4/5 scope, external-constraint handling, revision attribution, duplicate/compound controls, and cross-dimension ownership are all attacked for gaming or false-confidence paths."
    evidence_required: "Explicit adversarial cases and conclusions tied to normative rules and exact V1 artifacts."
  - id: AC-5
    requirement: "Level progression is challenged for assurance meaning without using rarity as a quota and without turning synthetic archetypes into implicit applicability profiles."
    evidence_required: "Adversarial fixture analysis derived from observable facts and normative rules, including checks that Level 5 cannot be reached through weak evidence or lower-level bypass."
  - id: AC-6
    requirement: "Validator/test coverage is evaluated for both under-enforcement and over-enforcement, and no recommendation assumes mechanical certainty over natural-language semantics that cannot be defensibly decided mechanically."
    evidence_required: "Concrete model-versus-validator/test comparisons, including the two seeded candidate exploit classes, each independently classified from evidence."
  - id: AC-7
    requirement: "No repository mutation occurs during audit execution and no future work is manufactured from NOT_REPRODUCED or UNKNOWN results."
    evidence_required: "Fresh end-of-audit ref/content identity check showing only the Architect planning commit exists beyond the frozen V1 subject and no Executor-created repository mutation occurred."
  - id: AC-8
    requirement: "The final audit conclusion distinguishes reproduced material findings, material unknowns, and attacks not reproduced, and states V1 release-assurance impact conservatively without self-authorizing remediation or release."
    evidence_required: "Final bounded audit result with release-impact rationale traceable to the per-attack evidence."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At audit start, require target branch HEAD to equal the exact handoff base and confirm the V1 semantic subject files still match their 71f2be951c9d44452f5f53122f4062390ef4cb39 blobs/content."
      required: true
    - id: CHECK-2
      command_or_check: "Complete the full semantic/adversarial coverage required by AC-1 through AC-6 and independently classify the two seeded candidate exploit classes rather than assuming the Architect's preliminary assessment is correct."
      required: true
    - id: CHECK-3
      command_or_check: "Before finalizing, perform an epistemic-state consistency review: no NOT_REPRODUCED result is described as disproven/clean, no UNKNOWN becomes PASS, and only REPRODUCED findings are described as eligible for downstream remediation consideration."
      required: true
    - id: CHECK-4
      command_or_check: "Refresh repository refs/content at audit end and prove no Executor mutation, branch creation, report artifact, task creation, promotion, tag, release, or metadata mutation occurred."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: false
  push: false
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions:
  - "Any request to fix a reproduced finding requires a later Governing Architect decision and fresh bounded canonical authority; TASK-0003 itself never authorizes remediation."
  - "Any material UNKNOWN that prevents safe V1 assurance remains unresolved; it is not converted to PASS or silently ignored for release readiness."
  - "Promotion, v1.0.0 tag creation, and GitHub Release publication are outside TASK-0003 and remain unauthorized."

execution_ready: true
