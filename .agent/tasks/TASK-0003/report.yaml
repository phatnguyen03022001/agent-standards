findings:
  - finding_id: F-001
    result: REPRODUCED
    title: "Vague conditional applicability can false-green through frozen bounded regression evidence"
    normative_rule: "STANDARD_MODEL requires conditional applicability predicates to describe observable target facts, forbids vague discretion, and requires unresolved applicability to remain UNKNOWN rather than becoming N/A."
    concrete_exploit: "Replace ASR-4.3 applicability.any_of with the non-factual predicate 'Where appropriate.'. The resulting requirement remains schema-valid to the generic validator."
    reproduction_evidence:
      - "Frozen validator validate_app checks only mode, nonempty list shape, and nonempty-string predicate values; it does not and defensibly cannot infer factuality from natural language."
      - "Frozen test test_audit_b_applicability_predicates_use_underlying_facts checks only that selected predicates are conditional and do not contain documented, identified, inventory, or identifies. 'Where appropriate.' satisfies that oracle."
      - "Frozen ASR-4.3 itself is factual ('A material verification blind spot exists...'), so the reproduced defect is regression-assurance fidelity, not a current canonical requirement-wording defect."
    material_consequence: "A future standards-definition regression can restore discretionary applicability and create fake N/A or scope escape paths while the generic validator and frozen bounded regression test remain green."
    owning_layer: "bounded regression assurance in tests/test_validate.py, not generic natural-language validation"
    minimal_closure_direction: "Add the smallest deterministic regression evidence that makes the known discretionary-predicate mutation fail without introducing a DSL, semantic parser, NLP/AI validator, or generalized keyword policy engine."
  - finding_id: F-002
    result: REPRODUCED
    title: "Static-only evidence can false-green a frozen runtime-behavior claim"
    normative_rule: "STANDARD_MODEL states that static artifact inspection cannot prove runtime behavior and that a runtime enforcement claim must include a mandatory obligation satisfiable only by runtime-capable or logically equivalent evidence."
    concrete_exploit: "For frozen OBS-1.1, whose statement requires material failures to emit attributable signals, replace evidence classes [reproducible_test, runtime_observation] with [artifact_inspection]."
    reproduction_evidence:
      - "Frozen OBS-1.1 is a runtime-behavior claim and currently uses only runtime-capable evidence classes for its behavior obligation."
      - "Frozen validator validate_evidence treats artifact_inspection as an allowed evidence-class enum and performs no claim-to-evidence semantic coupling, so the static-only mutation remains validator-valid."
      - "The exact frozen tests contain no OBS-1.1-specific oracle and no artifact_inspection-specific semantic guard; therefore the bounded regression suite does not reject this known model-invalid substitution."
    material_consequence: "A runtime assurance obligation can regress into documentation/static proof while derived enforcement remains green, allowing false runtime confidence."
    owning_layer: "bounded regression assurance for known frozen semantics, not generic semantic inference"
    minimal_closure_direction: "Add the smallest deterministic regression evidence that rejects the known static-only substitution for the frozen runtime claim without introducing a generalized semantic inference mechanism."

