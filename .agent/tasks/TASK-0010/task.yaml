acceptance_criteria:
  - id: AC-1
    requirement: "TD-001 is causally reproduced without dirtying the trusted target checkout."
    evidence_required: "Isolated baseline evidence shows the prior direct Python verification path can succeed while creating repository-local Python cache artifacts."
  - id: AC-2
    requirement: "The repository owns one minimal bytecode-safe verification entrypoint that delegates to existing Generation 1 validation/tests."
    evidence_required: "tools/verify.py uses current-interpreter child Python execution with explicit bytecode suppression, runs tools/validate.py and the root unittest discovery, and propagates nonzero failures."
  - id: AC-3
    requirement: "The documented canonical verification command uses the bytecode-safe entrypoint."
    evidence_required: "README Validation points to tools/verify.py and no longer instructs users to run the two direct bytecode-writing verification commands as the canonical path."
  - id: AC-4
    requirement: "Regression coverage prevents accidental removal of bytecode suppression or failure propagation."
    evidence_required: "Focused tests deterministically prove child verification runs under no-bytecode semantics and a simulated/isolated child failure yields runner failure."
  - id: AC-5
    requirement: "Successful exact-final verification leaves the repository physically and Git-clean without cleanup."
    evidence_required: "Before/after artifact scan shows no newly created __pycache__/pyc/pyo paths and git status remains clean immediately after successful verification, before any cleanup command."
  - id: AC-6
    requirement: "Generation 1 and the Assessment Kernel Candidate remain behaviorally intact."
    evidence_required: "New repository-owned verification passes the complete root Generation 1 suite; candidate focused suite passes under explicit bytecode suppression; exact diff proves no candidate or frozen normative/enforcement file changed."
  - id: AC-7
    requirement: "No masking/runtime redesign is used to close the debt."
    evidence_required: "Diff contains no .gitignore, agent-runtime, dependency, CI, schema, or cleanup-policy changes; report explicitly states whether a reachable external agent-standards runtime profile still needs operator configuration alignment."
  - id: AC-8
    requirement: "Executor publishes bounded evidence and stops for Architect review."
    evidence_required: "Implementation commit changes only README.md, tools/verify.py, and tests/test_verify_hygiene.py; enclosing report commit changes only TASK-0010/report.yaml; main remains unchanged and branches remain exactly {dev, main}."

