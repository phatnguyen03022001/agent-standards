    requirement: "VF-001 is causally reproduced as a false-green verification path."
    evidence_required: "Behavioral RED evidence proves the revision-1 exact-copy test returns before its proof body when run under the canonical -B root environment."
  - id: AC-2
    requirement: "The outer exact-copy proof actually executes under -B without recursive false-green behavior."
    evidence_required: "Focused GREEN evidence under python -B -m unittest ... demonstrates the outer proof body ran and completed; any nested self-test suppression is explicitly attributable to a narrow sentinel/context."
  - id: AC-3
    requirement: "Canonical repository verification proves prevention rather than cleanup."
    evidence_required: "python tools/verify.py passes on exact final state and evidence demonstrates the exact-copy test executed, observed zero cache artifacts and empty git status immediately after copied verification, before cleanup."
  - id: AC-4
    requirement: "Existing runner semantics and project semantics are preserved."
    evidence_required: "README.md/tools/verify.py/frozen V1/candidate blobs remain unchanged; validator/root suite pass; candidate 12/12 passes under -B."
  - id: AC-5
