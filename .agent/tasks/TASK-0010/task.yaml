structure_authority:
  status: RESOLVED
  source: "Existing tools/ and tests/ ownership plus current README Validation section"
  rationale: "The smallest durable repository-owned closure is one minimal verification runner under tools/, one focused regression under tests/, and a README command update. No runtime subsystem, schema, dependency, or ignore-policy change is justified."

objective: "Close repository-owned TD-001 by making the canonical agent-standards Python verification entrypoint bytecode-write-free, proving successful verification leaves no persistent Python cache artifacts and preserves a clean checkout, while leaving frozen Generation 1 semantics and the non-released Assessment Kernel Candidate semantics unchanged."

debt:
  id: TD-001
  classification: verification_hygiene
  severity: low
  reproduced_problem: "Successful Python verification can create __pycache__/bytecode artifacts in the trusted checkout, causing postcondition failure or requiring resynchronization."
  closure_invariant: "Repository-owned trusted verification must not leave persistent run-generated Python bytecode artifacts that violate checkout postconditions."
  primary_mechanism: "Prevent bytecode writes during repository-owned Python verification; do not mask generated state with ignore rules."

scope:
  required_changes:
    - "Resolve exact TASK-0010 revision 1 and pinned agent-skills authority, refresh remote truth, and require live dev HEAD to equal the exact handoff base before mutation."
    - "Before mutation, inspect the current README Validation commands and current Generation 1 validator/test entrypoints. Reproduce TD-001 in an isolated disposable copy or equivalent bounded workspace by demonstrating that the current direct non--B Python verification path can create repository-local __pycache__ and/or *.pyc artifacts while the underlying validation/tests succeed. Do not dirty the trusted target checkout merely to reproduce the debt."
    - "Create tools/verify.py as the single minimal repository-owned verification runner. It must use only the Python standard library and execute exactly the existing Generation 1 validator and existing root unittest suite with bytecode writing disabled for the child Python processes, using the current interpreter identity rather than assuming a separate python binary."
    - "The runner must preserve command failure semantics: any nonzero validator or unittest result must cause the runner to exit nonzero; successful existing validation/tests must produce zero. It must not suppress test output needed for diagnosis."
    - "Do not reimplement validation logic inside the runner. It is orchestration only; tools/validate.py and tests remain the existing Generation 1 enforcement implementation."
    - "Update README.md Validation so the canonical repository-owned verification command uses tools/verify.py instead of separately invoking bytecode-writing Python validator/test commands. Keep dependency installation guidance intact unless a mechanical wording adjustment is required."
    - "Create tests/test_verify_hygiene.py with focused deterministic coverage of the new runner. At minimum prove the runner invokes the existing validator and unittest suite under explicit no-bytecode semantics and propagates a child failure rather than returning a false success. Prefer direct behavior tests over fragile source-string assertions."
    - "On the exact final implementation state, run the new repository-owned verification entrypoint from a clean isolated Git worktree/copy or trusted checkout whose before/after state can be observed. Require validator PASS and the complete root unittest suite PASS."
    - "After that successful verification, deterministically require that no new repository-local __pycache__, *.pyc, or *.pyo artifacts were created and that Git working-tree status remains clean. Evidence must distinguish prevention from cleanup: the pass must not depend on deleting generated cache after verification."
    - "Run the existing non-released candidate focused suite with explicit bytecode suppression (for example the equivalent of python -B -m unittest discover -s candidate/assessment_kernel -p 'test_*.py' -v) and require its existing regressions remain passing without candidate code changes. This check does not make the candidate part of Generation 1 authority."
    - "Inspect, but do not mutate, any reachable current agent-runtime project profile for agent-standards. If its verify_argv is observable and does not use the new repository-owned bytecode-safe verification entrypoint, record that as an external operator-configuration follow-up rather than modifying agent-runtime code/config or claiming the profile was changed. Repository TD-001 closure is judged on the repo-owned verification contract and executable behavior."
    - "Commit and push the bounded implementation on dev, then create, commit, and push only .agent/tasks/TASK-0010/report.yaml as Executor-owned evidence and stop at the Architect review boundary with NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - README.md
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
    - candidate/assessment_kernel/*
    - .agent/tasks/TASK-0009/*
    - .agent/tasks/TASK-0010/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Frozen Generation 1 normative semantics remain unchanged."
  - "standards/manifest.yaml and all standards/*.yaml remain byte-for-byte unchanged."
  - "STANDARD_MODEL.md remains byte-for-byte unchanged."
  - "tools/validate.py remains semantically and byte-for-byte unchanged."
  - "Existing Generation 1 test semantics remain unchanged except for adding the focused verification-hygiene regression file."
  - "Assessment Kernel Candidate README/model/tests remain byte-for-byte unchanged."
  - "The new runner orchestrates existing verification; it does not become a new normative authority."
  - "Bytecode/cache mutation is prevented rather than hidden with .gitignore."
  - "No cleanup-after-success is accepted as proof of TD-001 closure; successful verification itself must leave no new Python cache artifacts."
  - "No agent-runtime implementation, sync semantics, config schema, or git-clean policy is modified."
  - "No local agent-runtime profile mutation is authorized by this task."
  - "No new dependency, parser, framework, CI workflow, branch, release, tag, or Generation 2 artifact is introduced."

forbidden_changes:
  - "Any mutation to STANDARD_MODEL.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, requirements-validator.txt, LICENSE, or frozen Generation 1 normative requirement content."
  - "Any mutation to candidate/assessment_kernel/README.md, candidate/assessment_kernel/model.py, or candidate/assessment_kernel/test_model.py."
  - "Any .gitignore creation or modification as the primary or sole TD-001 closure."
  - "Any post-verification cache deletion used to manufacture a clean result."
  - "Any agent-runtime repository code change, git clean -fdx change, runtime config-schema/environment subsystem, or local profile mutation."
  - "Any NLP, Generation 2, family/dimension, maturity-kernel semantic, product/business/service-operations design work."
  - "Any dependency change, CI/GitHub Actions change, branch creation, main mutation, promotion, tag, release, repository metadata mutation, or external publication."
  - "Any new file except tools/verify.py, tests/test_verify_hygiene.py, and .agent/tasks/TASK-0010/report.yaml."
  - "Any modification to .agent/tasks/TASK-0010/task.yaml by Executor."
  - "Any TASK-0011 or later task, review.yaml, continuation artifact, or additional planning artifact created by Executor."

