structure_authority:
  status: RESOLVED
  source: "Existing TASK-0010 implementation plus Architect review finding VF-001"
  rationale: "The implementation runner appears semantically correct; the reproduced problem is that the exact-clean proof silently returns under the canonical -B root test process. The smallest correction is confined to the existing hygiene regression and report evidence unless a deterministic counterexample proves the runner itself must change."

objective: "Close VF-001 by making TASK-0010's exact-final no-cache/no-cleanup proof actually execute under the same canonical bytecode-disabled root unittest environment used by tools/verify.py, while preserving the accepted runner behavior, frozen Generation 1, and Assessment Kernel Candidate unchanged."

revision_finding:
  id: VF-001
  classification: verification_false_green
  severity: material_for_acceptance
  reproduced_problem: "test_runner_leaves_exact_tracked_copy_clean_without_cleanup returns immediately when sys.dont_write_bytecode is true, while tools/verify.py invokes the complete root unittest suite with -B; therefore the report's claimed AC-5 exact-final proof is not actually exercised by the canonical verification run."
  required_closure: "The outer exact-final clean-copy proof must execute when the root suite runs under -B. Any recursion prevention must be explicit and test-owned rather than using dont_write_bytecode as a proxy that suppresses the proof."

scope:
  required_changes:
    - "Resolve exact TASK-0010 revision 2 and pinned agent-skills authority, refresh remote truth, and require live dev HEAD to equal the exact handoff base before mutation."
    - "Causally reproduce VF-001 against the revision-1 test behavior: demonstrate that when the focused hygiene suite runs under -B, test_runner_leaves_exact_tracked_copy_clean_without_cleanup exits before performing its exact-copy verification body. Capture behavior-level evidence; do not rely only on source inspection."
    - "Modify only tests/test_verify_hygiene.py unless the reproduced behavior proves tools/verify.py itself is incorrect. The expected correction is to remove the dont_write_bytecode-based outer-proof suppression and, if recursion prevention is needed because the copied exact runner recursively discovers the same hygiene test, use an explicit test-owned nested-verification sentinel/context or an equivalently narrow mechanism."
    - "The outer exact-copy test must execute its full proof even when sys.dont_write_bytecode is true: create a fresh Git repository from the exact tracked implementation snapshot, establish a clean baseline with zero Python cache artifacts, run that copied exact tools/verify.py, then immediately require zero __pycache__/pyc/pyo artifacts and empty git status before any cleanup."
    - "If a nested-verification sentinel is used, it may suppress only the recursively nested instance of the exact-copy self-test. It must not suppress validator execution, the ordinary root test suite, bytecode-behavior tests, failure-propagation tests, or the outer exact-copy proof."
    - "Run the focused hygiene regression under the same bytecode-disabled root environment: python -B -m unittest discover -s tests -p 'test_verify_hygiene.py' -v. Require the exact-copy proof to be behaviorally demonstrated as executed, not merely counted as a passing test."
    - "Run python tools/verify.py on the exact final state and require validator success plus the complete root suite success. Require evidence that the exact-copy no-cleanup proof executed during this canonical run."
    - "Run the Assessment Kernel Candidate focused suite with explicit -B and require all existing 12 regressions pass without candidate changes."
    - "Verify README.md and tools/verify.py remain byte-for-byte unchanged from implementation commit 6f83e805596ac536c96d3fbcea26be5665f3ff0b unless a deterministic runner defect is reproduced; if a runner change becomes necessary, stop AUTHORITY_REQUIRED rather than expanding silently."
    - "Preserve the revision-1 external runtime-profile observation as FOLLOW_UP only. No local profile or agent-runtime mutation is authorized."
    - "Commit and push the bounded regression correction on dev, update .agent/tasks/TASK-0010/report.yaml to report_revision 2 with VF-001 causal RED/GREEN evidence, commit and push only the report change, and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - tests/test_verify_hygiene.py
    - tools/verify.py
    - README.md
    - tools/validate.py
    - tests/test_validate.py
    - requirements-validator.txt
    - candidate/assessment_kernel/*
    - .agent/tasks/TASK-0010/task.yaml
    - .agent/tasks/TASK-0010/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "Frozen Generation 1 normative semantics and enforcement implementation remain unchanged."
  - "STANDARD_MODEL.md, standards/manifest.yaml, standards/*.yaml, tools/validate.py, and requirements-validator.txt remain byte-for-byte unchanged."
  - "Assessment Kernel Candidate files remain byte-for-byte unchanged."
  - "README.md and tools/verify.py remain byte-for-byte unchanged unless a deterministic runner defect is reproduced and Architect authority is revised."
  - "Canonical repository verification remains python tools/verify.py."
  - "The exact-final clean/no-cache proof must execute under canonical root -B execution; a passing count caused by an early return is not evidence."
  - "No cleanup-after-success may be used as TD-001 closure proof."
  - "No .gitignore masking, git clean -fdx, agent-runtime code/config/schema change, local profile mutation, dependency, CI, branch, release, or Generation 2 work is introduced."

forbidden_changes:
  - "Any mutation outside tests/test_verify_hygiene.py and .agent/tasks/TASK-0010/report.yaml unless a deterministic tools/verify.py defect is reproduced and Architect authority is revised first."
  - "Any modification to README.md, tools/verify.py, tools/validate.py, STANDARD_MODEL.md, standards/manifest.yaml, standards/*.yaml, requirements-validator.txt, LICENSE, candidate/assessment_kernel/*, or TASK-0010/task.yaml by Executor."
  - "Any use of sys.dont_write_bytecode as the condition that suppresses the outer exact-final clean-copy proof."
