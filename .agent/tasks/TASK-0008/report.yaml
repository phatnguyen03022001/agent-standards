  - {hypothesis: H1, archetype: D, result: SURVIVES, reasoning: "User-reported trust evidence can support the trust claim but cannot satisfy an independent technical security/privacy/safety claim; exact claim binding preserves the boundary."}
  - {hypothesis: H2, archetype: A, result: SURVIVES, reasoning: "Subscription or recurring-use labels do not decide which outcome, causal, support, or business obligations apply; the factual predicate for the exact obligation does."}
  - {hypothesis: H2, archetype: B, result: SURVIVES, reasoning: "Zero external revenue does not make Business concerns N/A when build cost, operating cost, labor savings, opportunity cost, or vendor dependence are materially present."}
  - {hypothesis: H2, archetype: C, result: SURVIVES, reasoning: "A one-shot utility can validly have near-zero retention by design, so a retention obligation is not made applicable merely by calling the target a product or utility."}
  - {hypothesis: H2, archetype: D, result: SURVIVES, reasoning: "The generic regulated/high-consequence fixture label does not establish any particular legal, security, privacy, or safety predicate; concrete jurisdiction, data, trust-boundary, and consequence facts do."}
  - {hypothesis: H3, archetype: A, result: SURVIVES, reasoning: "A PARTIAL outcome/evidence obligation remains unmet even when other product observations PASS; it cannot be converted into maturity satisfaction by surrounding success."}
  - {hypothesis: H3, archetype: B, result: SURVIVES, reasoning: "A PASS on verified labor savings cannot compensate for an UNKNOWN cost obligation or a GAP in a material vendor-dependency obligation."}
