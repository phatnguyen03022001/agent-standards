  - {hypothesis: H7, archetype: B, result: SURVIVES, reasoning: "Labor-savings trajectory requires comparable workflow/team/time definitions and evidence that realized labor changed; a revised estimate or score alone is insufficient."}
  - {hypothesis: H7, archetype: C, result: SURVIVES, reasoning: "Two migration runs can be compared only for an exact property over sufficiently comparable scopes/data; a status delta without comparable run semantics does not establish trajectory."}
