mandatory_attacks:
  - attack_id: ATK-TRAJECTORY-SAME-CODE
    targets: [H1, H5, H6, H7, H8, H9]
    fixture: "A plus cross-cutting service-state variation"
    setup: "Deployed source commit is unchanged. Curriculum and support process change; cohort definition and measurement window are held sufficiently comparable. User completion outcome moves to a later measured state with attributable operational/outcome evidence."
    result: SURVIVES
    finding: "Substantive trajectory can be asserted for the exact outcome-bearing claim because the assessed property itself changed under sufficient comparability. Source revision is not the subject-state identity. The result does not by itself establish that source code or product causally caused the change."
    minimum_correction: NONE
  - attack_id: ATK-KNOWLEDGE-VS-MATURITY
    targets: [H1, H6, H7, H8, H9]
    fixture: A/B/C/D
    setup: "Underlying subject is unchanged. Instrumentation improves, newly available old evidence is recovered, or a prior scoring/evidence-mapping mistake is corrected, producing a higher later assessment."
    result: SURVIVES
    finding: "The later assessment may be better informed or corrected, but the delta is classified as observation/assessment-correction rather than subject improvement unless separate evidence establishes subject-property change."
    minimum_correction: NONE
  - attack_id: ATK-BUSINESS-INTERNAL-TOOL
    targets: [H1, H2, H4, H5, H10]
    fixture: B
    setup: "Internal engineering tool has zero external revenue but attributable build cost, operating cost, material labor savings, vendor dependency, and opportunity cost."
    result: SURVIVES
    finding: "Business/economic applicability follows those material facts, not monetization or external revenue. The parallel economic claims do not require a scalar."
    minimum_correction: NONE
  - attack_id: ATK-USER-PRODUCT-ONE-SHOT
    targets: [H1, H2, H4, H5]
    fixture: C
    setup: "Migration utility is intended to succeed once. Correct migrations terminate use; successful users therefore have near-zero retention by design."
    result: SURVIVES
    finding: "Retention is not a universal maturity requirement. Exact intended outcome/correctness may be assessed without treating successful non-return as immaturity."
    minimum_correction: NONE
  - attack_id: ATK-FAMILY-BOUNDARY
    targets: [H1, H3, H4, H10]
    fixture: D
    setup: "User-reported trust evidence is PASS-like while Engineering SEC independently has a known applicable GAP."
    result: SURVIVES
    finding: "Both facts remain simultaneously true. Trust evidence cannot satisfy the SEC obligation, and no family/overall compression can compensate the SEC GAP away."
    minimum_correction: NONE
  - attack_id: ATK-NON-LADDER-SCALAR
    targets: [H3, H4, H10]
    fixture: B
    setup: "Plausible non-engineering Business Economics dimension contains parallel claims for realized labor savings, operating cost visibility, vendor dependency, and opportunity cost. No universal cumulative ordering among those obligations is defensible."
    result: SURVIVES
    finding: "The kernel permits requirement/claim-level states and forbids manufacturing a dimension scalar merely for presentation. Status semantics remain meaningful without a scalar."
    minimum_correction: NONE
  - attack_id: ATK-IDENTITY-UNDER-OVER
    targets: [H1, H5, H7]
    fixture: A/B/C/D
    setup: "Under-specified identity uses only repository commit for claims materially affected by population, time window, curriculum/support process, dataset/run, workflow/team, jurisdiction, or environment. Over-specified alternative requires one universal schema carrying unrelated fields for every claim."
    result: SURVIVES
    finding: "Repository commit alone is insufficient when non-source context can change interpretation. The minimum identity is typed and claim-relative: include only attributes whose difference is material to the exact claim and comparison. No universal mega-schema is required."
    minimum_correction: NONE
  - attack_id: ATK-CAUSAL-INFERENCE
    targets: [H1, H5, H7, H10]
    fixture: A
    setup: "Observational evidence shows user outcomes improved. A stronger claim asserts that the product caused the improvement."
    result: SURVIVES
    finding: "Outcome realization evidence may support the observational outcome claim, but the causal product-contribution claim requires evidence adequate to that stronger inference, such as a credible counterfactual design or equivalent causal identification. No generic claim-strength or evidence-strength score is needed."
    minimum_correction: NONE

trajectory_cases:
  - case_id: TR-POS-1
    classification: SUBSTANTIVE_TRAJECTORY_SUPPORTED
    setup: "Same deployed source; support process materially changes; same outcome definition and sufficiently comparable cohort/window; attributable evidence shows successful-completion property changed."
    reason: "The assessed outcome-bearing property changed and the comparison is sufficiently comparable. The trajectory claim is limited to that exact property; causal attribution to software is not inferred."
  - case_id: TR-FP-1
    classification: REJECTED_AS_SUBJECT_IMPROVEMENT
    setup: "Instrumentation fixes an undercount and later assessment score rises while historical underlying outcomes are unchanged."
    reason: "Observation quality changed; the subject property did not. Change basis is observation/assessment correction."
  - case_id: TR-FP-2
    classification: REJECTED_AS_SUBJECT_IMPROVEMENT
    setup: "A prior scoring/status mapping mistake is corrected or the governing standard/threshold changes, producing a higher status for unchanged subject evidence."
    reason: "Assessment/standards basis changed; no evidence establishes subject-property change."
  - case_id: TR-FP-3
    classification: COMPARISON_NOT_ESTABLISHED
    setup: "Aggregate outcome rises because the population mix changes materially, with no stratification or evidence supporting like-for-like comparability."
    reason: "Score delta exists but comparability for the exact trajectory claim is insufficient."

status_algebra_no_scalar:
  case: "Internal-tool Business Economics candidate with no defensible cumulative ladder."
  states:
    - {claim: realized_labor_savings, status: PASS, meaning: "Exact obligation and evidence are satisfied for its assessed scope."}
    - {claim: operating_cost_visibility, status: PARTIAL, meaning: "Some cost components are established but the exact obligation is not fully satisfied."}
    - {claim: vendor_dependency_exit_risk, status: GAP, meaning: "Evidence establishes non-conformance for the exact applicable obligation."}
    - {claim: opportunity_cost_attribution, status: UNKNOWN, meaning: "Available attributable evidence cannot establish satisfaction or inapplicability."}
    - {claim: external_revenue_effect, status: N/A, meaning: "Only valid if its explicit applicability predicate depends on external revenue and target facts demonstrate that predicate false; it is excluded, not passed."}
    - {claim: bounded_procurement_exception, status: EXCEPTION, meaning: "Applicable obligation is intentionally unmet under explicit bounded acceptance; it remains unmet for maturity."}
  anti_gaming: "No state is converted to points, percentages, weights, family score, or synthetic overall score. PASS on labor savings does not compensate PARTIAL/GAP/UNKNOWN/EXCEPTION elsewhere. N/A removes only a proven-inapplicable obligation."
  result: SURVIVES

identity_derivation:
  principle: "Typed identity is derived from the exact claim and comparison, not from a universal target profile."
  examples:
    A: ["service/product identity", "assessed claim", "population/cohort when material", "measurement window", "curriculum/support-process version when material", "standards revision for maturity claims"]
    B: ["tool/service identity", "workflow/team scope", "time window", "deployment/configuration when material", "vendor/economic context when material", "standards revision for maturity claims"]
    C: ["utility identity", "source/target dataset identity", "transformation/configuration", "run/scope", "standards revision for maturity claims"]
    D: ["service identity", "environment/surface", "jurisdiction/regime when material", "population/scope", "service/process configuration when material", "standards revision for maturity claims"]
  excluded_rule: "Do not require unrelated fields merely because they exist in another archetype or could matter to a different claim."

cross_cutting_attacks:
  - attack_id: XC-REGULATORY-CLASSIFICATION
    targets: [H2, H5]
    setup: "A governing external rule uses an authoritative classification such as a regulated service class as an applicability predicate."
    result: SURVIVES
    reason: "A validated authoritative classification is a target fact used by the governing predicate, not an analytic archetype shortcut. The generic A-D fixture names still carry no applicability authority by themselves."
  - attack_id: XC-STANDARD-RELAXATION
    targets: [H6, H8, H9]
    setup: "Subject evidence is unchanged but a later standards revision relaxes or redefines an obligation and assessment status rises."
    result: SURVIVES
    reason: "History must attribute the standards/assessment basis; the higher judgment is not evidence that the subject improved."
  - attack_id: XC-SUBGROUP-COMPRESSION
    targets: [H1, H10]
    setup: "A population-wide average is favorable while a material subgroup has a severe failure relevant to the asserted scope."
    result: SURVIVES
    reason: "A population metric may be reported for its exact claim, but it cannot be used as compensating compression that hides the material subgroup failure."
  - attack_id: XC-SUBJECT-SPLIT-MERGE
    targets: [H5, H7, H9]
    setup: "One service is split into materially different tiers or two services are merged between assessments."
    result: SURVIVES
    reason: "Trajectory is permitted only for the exact comparable unit/claim after typed identity and scope mapping; history preserves the judgment boundaries instead of fabricating one continuous objective scalar history."

