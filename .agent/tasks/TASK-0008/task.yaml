    - repository_content_read
    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "Every H1-H10 hypothesis is adversarially evaluated against every A-D fixture with no skipped cell and no archetype used as an applicability shortcut."
    evidence_required: "A complete 10 x 4 matrix or equivalently explicit per-pair structure with SURVIVES/FAILS/AMBIGUOUS outcome and concise reasoning."
  - id: AC-2
    requirement: "All mandatory counterexample classes in task scope are explicitly tested: non-source subject change, knowledge-only assessment change, internal-tool economics without revenue, one-shot utility without retention, cross-family trust/security divergence, non-ladder dimension, typed/material identity, and causal-inference burden."
    evidence_required: "Named report sections or structured findings showing each attack, result, and any minimum correction."
  - id: AC-3
    requirement: "The report preserves the distinctions among PASS, PARTIAL, GAP, UNKNOWN, N/A, and EXCEPTION without assuming a maturity scalar and does not introduce compensating or soft scoring."
    evidence_required: "Explicit analysis of status algebra under at least one no-scalar case plus anti-gaming conclusions."
  - id: AC-4
    requirement: "Trajectory conclusions require both comparability sufficient for the exact comparison claim and evidence that the assessed property changed; assessment correction/evidence improvement alone is not labeled subject improvement."
    evidence_required: "At least one positive substantive-trajectory case and at least two false-positive delta cases rejected for distinct reasons."
  - id: AC-5
    requirement: "Any proposed kernel correction is the smallest change needed to close a reproduced counterexample and remains non-authoritative pending Architect review."
    evidence_required: "For each FAILS/AMBIGUOUS item, counterexample -> consequence -> minimum correction traceability; surviving items are not gratuitously rewritten."
  - id: AC-6
    requirement: "The Executor leaves frozen V1 and all non-report repository content untouched and publishes only the canonical TASK-0008 report on dev."
    evidence_required: "Exact post-push compare from handoff base showing only .agent/tasks/TASK-0008/report.yaml changed and main remained unchanged."
  - id: AC-7
    requirement: "The report gives the Architect a bounded next-decision summary without self-accepting the design."
    evidence_required: "A final advisory conclusion identifying hypotheses that survived unchanged, require correction, remain ambiguous, and any structural blocker discovered; terminal result remains NEEDS_REVIEW."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start, refresh remote refs and require dev equals the exact handoff base, main remains 3f4950f280a3a35fee81471d4b83715fa72cf9ee, branches remain exactly {dev, main}, TASK-0008 revision 1 resolves at the base, and pinned agent-skills revision 0a57fbfd39b96494f22fea1f7847aab1d5c8bbf1 is accessible."
      required: true
    - id: CHECK-2
      command_or_check: "Verify TASK-0008 planning changed only .agent/tasks/TASK-0008/task.yaml relative to 3f4950f280a3a35fee81471d4b83715fa72cf9ee and no frozen V1 semantic artifact changed before analysis begins."
      required: true
    - id: CHECK-3
      command_or_check: "Verify report coverage contains all 40 HxA cells plus every mandatory attack required by AC-2, and that no surviving hypothesis is claimed canonical or approved."
      required: true
    - id: CHECK-4
      command_or_check: "Before report commit, verify the only intended content change is .agent/tasks/TASK-0008/report.yaml and refresh dev/main for staleness."
      required: true
    - id: CHECK-5
      command_or_check: "After report commit/push, require dev equals the exact report commit; its sole parent is the handoff base; only .agent/tasks/TASK-0008/report.yaml changed; main still equals 3f4950f280a3a35fee81471d4b83715fa72cf9ee; branches remain exactly {dev, main}; then stop NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

git_authority:
  create_branch: false
  commit: true
  push: true
  promote_to_main: false

release_authority:
  create_version_tag: false
  mutate_repository_metadata: false
  publish_release: false

blocking_decisions:
  - "If live dev differs from the exact handoff base before mutation, stop STALE_STATE; do not adopt a newer SHA, rebase, merge, reset, or rewrite task authority."
  - "If TASK-0008 revision 1, frozen V1 baseline, or pinned agent-skills authority cannot be resolved exactly, stop BLOCKED or AUTHORITY_REQUIRED rather than reconstructing semantics from memory."
  - "If a hypothesis is genuinely underdetermined by the fixtures, record AMBIGUOUS with the missing decision/evidence and minimum needed clarification; do not manufacture a PASS/SURVIVES result."
  - "A reproduced conceptual counterexample does not authorize editing standards or task authority. Record it in report evidence and return it to Architect review."
  - "If required repository content write/push capability is unavailable, stop CURRENT_PHASE_CAPABILITY_UNAVAILABLE before any mutation."

execution_ready: true
