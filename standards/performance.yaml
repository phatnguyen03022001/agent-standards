dimension: PER
applicability:
  mode: always
requirements:
- id: PER-1.1
  level: 1
  statement: Expected workload must remain within explicit latency, throughput, and computational-behavior bounds for the
    stated use envelope.
  intent: Establish bounded baseline delivered performance.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Expected workload remains within explicit delivered-performance bounds.
      classes:
      - reproducible_test
      - runtime_observation
    independence: none
- id: PER-2.1
  level: 2
  statement: Material latency, throughput, and capacity objectives must be measured under representative workload across the
    stated normal operating envelope.
  intent: Replace performance assertion with repeatable measurement.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Representative measurements support the claimed normal performance envelope.
      classes:
      - reproducible_test
      - runtime_observation
    independence: none
- id: PER-3.1
  level: 3
  statement: Peak load, tail behavior, contention, overload, hot spots, and backpressure must remain predictably bounded within
    the stated performance envelope.
  intent: Bound abnormal and saturation-adjacent performance behavior.
  applicability:
    mode: conditional
    any_of:
    - Peak load, tail behavior, contention, overload, hot spots, backpressure, or an equivalent saturation-adjacent condition
      can affect a claimed performance objective.
  evidence:
    required:
    - demonstrates: Stress conditions preserve stated tail, saturation, and overload behavior.
      classes:
      - reproducible_test
      - runtime_observation
    independence: none
- id: PER-4.1
  level: 4
  statement: Highest-consequence saturation and capacity-limit behavior must degrade within explicit performance boundaries.
  intent: Prove predictable behavior at consequential capacity limits.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The highest-consequence saturation or capacity-limit boundary is explicitly selected and stated.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Sustained runtime-capable evidence demonstrates degradation remains within that boundary.
      classes:
      - reproducible_test
      - runtime_observation
    independence: independent_review
- id: PER-5.2
  level: 5
  statement: Workload, capacity, and environmental assumptions for the highest-consequence operating envelope must be explicit
    and bounded.
  intent: Make high-assurance performance assumptions independently diagnosable from envelope conformance.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The highest-consequence operating envelope and its workload, capacity, and environmental assumptions are
        explicit and bounded.
      classes:
      - artifact_inspection
      - analysis
    independence: independent_review
- id: PER-5.3
  level: 5
  statement: The highest-consequence operating envelope must remain valid throughout its explicit workload, capacity, and
    environmental assumptions.
  intent: Establish exceptional confidence in the highest-consequence performance envelope.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The selected operating envelope remains valid throughout the stated assumptions.
      classes:
      - reproducible_test
      - formal_verification
    independence: independent_reproduction
