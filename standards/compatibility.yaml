dimension: CMP
applicability: {mode: always}
requirements:
  - id: CMP-1.1
    level: 1
    statement: Explicitly supported consumers, environments, and interfaces must behave according to their stated contracts.
    intent: Make support claims truthful and verifiable.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative supported contracts hold in the claimed consumers or environments.
          classes: [reproducible_test, artifact_inspection]
      independence: none
  - id: CMP-2.1
    level: 2
    statement: Claimed compatibility ranges and version-transition semantics must be explicit and verified across representative supported combinations.
    intent: Bound routine version and environment drift.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Supported version transitions and compatibility ranges conform to their stated semantics.
          classes: [reproducible_test, analysis]
      independence: none
  - id: CMP-3.1
    level: 3
    statement: Deprecation, migration, multi-version interaction, platform variation, and backward or forward compatibility risks must be bounded wherever such support is claimed.
    intent: Contain complex compatibility transitions.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative transition and variation scenarios remain within claimed compatibility bounds.
          classes: [reproducible_test, analysis]
      independence: none
  - id: CMP-4.1
    level: 4
    statement: Long-lived or consequential compatibility guarantees must have controlled transition mechanisms and independently reviewed conformance evidence across their claimed scope.
    intent: Protect high-impact external guarantees during change.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent review confirms consequential compatibility guarantees and transition controls.
          classes: [reproducible_test, artifact_inspection]
      independence: independent_review
  - id: CMP-5.1
    level: 5
    statement: Critical compatibility claims must be independently reproduced across the claimed support matrix or an equivalent explicit conformance model.
    intent: Establish exceptional confidence in critical compatibility guarantees.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent reproduction confirms critical compatibility across the complete claimed model.
          classes: [reproducible_test, formal_verification]
      independence: independent_reproduction
