dimension: COR
applicability:
  mode: always
requirements:
  - id: COR-1.1
    level: 1
    statement: Expected-use inputs and valid states must produce the explicitly intended outcomes, including explicit failure outcomes for rejected operations.
    intent: Establish a directly testable behavioral baseline.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Expected-use and rejection behavior matches stated invariants.
          classes: [reproducible_test, formal_verification]
      independence: none
  - id: COR-2.1
    level: 2
    statement: Behavioral invariants must remain true across ordinary boundary conditions and state transitions, including ordering, concurrency, time, or idempotency semantics where those facts affect outcomes.
    intent: Prevent routine edge conditions from changing intended semantics.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Relevant boundary and transition cases preserve the stated invariants.
          classes: [reproducible_test, analysis]
      independence: none
  - id: COR-3.1
    level: 3
    statement: Hostile, pathological, raced, partially completed, or dependency-degraded input and state sequences must not produce logically invalid committed behavior.
    intent: Preserve semantics under abnormal execution sequences.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Abnormal sequences are rejected, contained, or completed without violating committed invariants.
          classes: [reproducible_test, formal_verification]
      independence: none
  - id: COR-4.1
    level: 4
    statement: High-impact correctness paths must detect or contain invalid intermediate states and provide a bounded route to a valid state or explicit safe failure.
    intent: Contain consequential correctness failures and recovery errors.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: High-impact invariant violations are detected or contained and recovery is bounded.
          classes: [reproducible_test, operational_exercise, formal_verification]
      independence: independent_review
  - id: COR-5.1
    level: 5
    statement: Critical behavioral invariants and their assumptions and failure envelopes must be explicit and supported by rigorous evidence that covers the claimed operating scope.
    intent: Justify exceptional confidence in critical semantics.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Critical invariants hold across the stated assumptions and failure envelope.
          classes: [formal_verification, reproducible_test]
      independence: independent_reproduction
