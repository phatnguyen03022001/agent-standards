dimension: COR
applicability:
  mode: always
requirements:
- id: COR-1.2
  level: 1
  statement: Expected-use inputs and valid states must produce the explicitly intended successful outcomes.
  intent: Establish a directly testable positive behavioral baseline.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Expected-use successful behavior matches the stated invariants.
      classes:
      - reproducible_test
      - formal_verification
    independence: none
- id: COR-1.3
  level: 1
  statement: Rejected or invalid operations must produce explicit intended failure outcomes without producing a successful
    effect.
  intent: Make rejection semantics independently diagnosable from successful behavior.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Rejected or invalid operations produce the stated failure outcome and no successful effect.
      classes:
      - reproducible_test
      - formal_verification
    independence: none
- id: COR-2.1
  level: 2
  statement: Behavioral invariants must remain true across every ordinary boundary condition and state transition in the in-scope
    execution model.
  intent: Prevent routine edge conditions from changing intended semantics.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Relevant boundary and transition cases preserve the stated invariants.
      classes:
      - reproducible_test
      - formal_verification
    independence: none
- id: COR-3.1
  level: 3
  statement: Hostile, pathological, raced, partially completed, or dependency-degraded input and state sequences must not
    produce logically invalid committed behavior.
  intent: Preserve semantics under abnormal execution sequences.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Abnormal sequences are rejected, contained, or completed without violating committed invariants.
      classes:
      - reproducible_test
      - formal_verification
    independence: none
- id: COR-4.2
  level: 4
  statement: Invalid intermediate states on highest-consequence correctness paths must be detected or contained before they
    can become an accepted committed state.
  intent: Prevent consequential intermediate-state corruption from becoming valid output.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The highest-consequence correctness paths and invalid intermediate states are explicitly identified.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Injected or derived invalid intermediate states are detected or contained before acceptance.
      classes:
      - reproducible_test
      - formal_verification
    independence: independent_review
- id: COR-4.3
  level: 4
  statement: A detected highest-consequence correctness failure must have a bounded route to a valid state or an explicit
    safe failure state.
  intent: Make consequential correctness recovery independently testable from detection.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Recovery or safe-failure transitions reach only defined bounded states after a consequential correctness
        failure.
      classes:
      - reproducible_test
      - operational_exercise
      - formal_verification
    independence: independent_review
- id: COR-5.2
  level: 5
  statement: The assumption and failure envelope for the highest-consequence behavioral invariants must be explicit and bounded
    across the stated operating scope.
  intent: Make the high-assurance correctness envelope independently diagnosable from behavioral proof.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The selected highest-consequence invariants, assumptions, failure envelope, and stated operating scope
        are explicit and attributable.
      classes:
      - artifact_inspection
      - analysis
    independence: independent_review
- id: COR-5.3
  level: 5
  statement: Highest-consequence behavioral invariants must hold throughout their explicit assumption and failure envelope.
  intent: Establish exceptional confidence in the most consequential semantics.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The selected invariants hold throughout the stated assumption and failure envelope.
      classes:
      - reproducible_test
      - formal_verification
    independence: independent_reproduction
