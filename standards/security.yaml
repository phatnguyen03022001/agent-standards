dimension: SEC
applicability:
  mode: conditional
  any_of:
    - A material trust or authority boundary, security-sensitive asset, privileged operation, or attacker-controlled interaction exists.
requirements:
  - id: SEC-1.1
    level: 1
    statement: Once this dimension applies, material authority boundaries must prevent untrusted interaction from trivially obtaining unauthorized access, privilege, or protected secrets.
    intent: Establish a baseline boundary against direct authority violations.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Direct untrusted interactions cannot cross identified authority boundaries without authorization.
          classes: [reproducible_test, analysis]
      independence: none
  - id: SEC-2.1
    level: 2
    statement: Security-sensitive operations must run with no more authority than required, protect exposed confidentiality and integrity interests, and fail to a bounded state when security decisions cannot be established.
    intent: Bound routine privilege and protection failures.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Authority, protection, and failure-default behavior match the stated security boundaries.
          classes: [artifact_inspection, reproducible_test, analysis]
      independence: none
  - id: SEC-3.1
    level: 3
    statement: Realistic adversarial input, abuse, privilege-escalation, isolation-bypass, and compromise-propagation paths must be explicitly bounded.
    intent: Contain credible hostile behavior beyond normal misuse.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative adversarial paths cannot exceed stated authority or isolation bounds.
          classes: [reproducible_test, analysis]
      independence: none
  - id: SEC-4.1
    level: 4
    statement: High-impact compromise paths and privileged operations must have defense-in-depth such that a single credible control failure does not automatically yield the full protected consequence.
    intent: Contain consequential compromise through layered boundaries.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent adversarial evaluation confirms high-impact paths remain bounded after a credible control failure.
          classes: [reproducible_test, analysis]
      independence: independent_review
  - id: SEC-5.1
    level: 5
    statement: The strongest claimed security boundaries must minimize and explicitly state trust assumptions and remain effective under independently reproduced adversarial challenge across the claimed scope.
    intent: Establish exceptional confidence in critical security boundaries.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent adversarial reproduction confirms critical boundaries under explicit trust assumptions.
          classes: [reproducible_test, formal_verification]
      independence: independent_reproduction
