dimension: MNT
applicability: {mode: always}
requirements:
  - id: MNT-1.1
    level: 1
    statement: Components, responsibilities, and interfaces must be understandable enough that a bounded local change can be identified without uncontrolled system-wide inference.
    intent: Establish a baseline for safe comprehension and local change.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative local changes have identifiable components, interfaces, and effects.
          classes: [artifact_inspection, analysis]
      independence: none
  - id: MNT-2.1
    level: 2
    statement: Dependencies, configuration, ownership boundaries, and change surfaces must be structured so routine change does not require uncontrolled edits across unrelated system areas.
    intent: Bound collateral effects of routine change.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative routine changes remain within explicit dependency and change boundaries.
          classes: [artifact_inspection, analysis]
      independence: none
  - id: MNT-3.1
    level: 3
    statement: Architectural boundaries must isolate material high-change or high-risk areas, and replacement or migration paths must be explicit where such evolution is claimed.
    intent: Prevent concentrated change from causing uncontrolled coupling.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Representative risky changes or migrations respect stated boundaries and dependency direction.
          classes: [analysis, reproducible_test]
      independence: none
  - id: MNT-4.1
    level: 4
    statement: Critical components must be evolvable or replaceable without uncontrolled whole-system reconstruction, with change impact independently reviewable from direct artifacts and evidence.
    intent: Bound consequential change and replacement risk.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent review can determine the bounded impact of representative critical changes.
          classes: [artifact_inspection, analysis]
      independence: independent_review
  - id: MNT-5.1
    level: 5
    statement: Representative consequential changes must be independently performed or derived with evidence that hidden coupling and semantic drift remain within explicit bounds.
    intent: Establish exceptional confidence in changeability.
    applicability: {mode: always}
    evidence:
      required:
        - demonstrates: Independent reproduction confirms consequential change can occur without uncontrolled hidden coupling or drift.
          classes: [analysis, reproducible_test]
      independence: independent_reproduction
