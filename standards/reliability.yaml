dimension: REL
applicability:
  mode: always
requirements:
- id: REL-1.1
  level: 1
  statement: Ordinary component failure must not create an uncontrolled failure of the whole in-scope system.
  intent: Establish a baseline bound on failure propagation.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Representative component failures remain within stated system failure bounds.
      classes:
      - reproducible_test
      - operational_exercise
      - formal_verification
    independence: none
- id: REL-2.2
  level: 2
  statement: Operations that can wait or be cancelled must have explicit time and cancellation bounds that prevent indefinite
    or uncontrolled continuation.
  intent: Make timeout and cancellation behavior independently diagnosable.
  applicability:
    mode: conditional
    any_of:
    - The target performs operations that can wait on time, external work, or cancellation.
  evidence:
    required:
    - demonstrates: Time and cancellation bounds are explicit for the affected operations.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative waits and cancellations obey the stated bounds.
      classes:
      - reproducible_test
      - runtime_observation
      - formal_verification
    independence: none
- id: REL-2.3
  level: 2
  statement: Retry or restart behavior must have explicit bounds that prevent repeated work from amplifying a routine failure
    without limit.
  intent: Separate retry and restart amplification from timeout and dependency handling.
  applicability:
    mode: conditional
    any_of:
    - The target retries or restarts work after a failure or indeterminate completion.
  evidence:
    required:
    - demonstrates: Retry or restart bounds and stop conditions are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative failures do not cause retry or restart behavior to exceed those bounds.
      classes:
      - reproducible_test
      - runtime_observation
      - formal_verification
    independence: none
- id: REL-2.5
  level: 2
  statement: Failure or unavailability of a dependency must keep target behavior within explicit failure bounds.
  intent: Make bounded dependency-failure behavior independently diagnosable from recovery.
  applicability:
    mode: conditional
    any_of:
    - The target depends on a component or external service whose failure or unavailability can affect in-scope operation.
  evidence:
    required:
    - demonstrates: Target behavior bounds during dependency failure or unavailability are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative dependency failures or unavailability remain within the stated target-behavior bounds.
      classes:
      - reproducible_test
      - operational_exercise
      - formal_verification
    independence: none
- id: REL-2.6
  level: 2
  statement: Recovery from dependency failure or unavailability must follow a repeatable path to a defined target state.
  intent: Make dependency-failure recovery independently diagnosable from failure containment.
  applicability:
    mode: conditional
    any_of:
    - The target depends on a component or external service whose failure or unavailability can affect in-scope operation.
  evidence:
    required:
    - demonstrates: The defined target recovery state and dependency-failure recovery path are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative recovery from dependency failure or unavailability repeatably reaches the defined target
        state.
      classes:
      - reproducible_test
      - operational_exercise
      - formal_verification
    independence: none
- id: REL-3.2
  level: 3
  statement: Overload and cascading failure must remain within explicit continuity and blast-radius bounds.
  intent: Contain saturation-driven and propagating failures.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: Continuity and blast-radius bounds for overload and cascade scenarios are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative overload and cascade scenarios remain within those bounds.
      classes:
      - reproducible_test
      - operational_exercise
    independence: none
- id: REL-3.3
  level: 3
  statement: Partial dependency loss, failover, and graceful degradation must remain within explicit continuity bounds.
  intent: Separate degraded dependency behavior from overload containment.
  applicability:
    mode: conditional
    any_of:
    - The target has a dependency, redundant component, or degraded operating mode whose partial loss can affect continuity.
  evidence:
    required:
    - demonstrates: Continuity bounds for partial dependency loss and failover/degradation are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Representative partial-loss and failover/degradation scenarios remain within those bounds.
      classes:
      - reproducible_test
      - operational_exercise
    independence: none
- id: REL-4.2
  level: 4
  statement: Highest-consequence failure scenarios must remain within explicit failure-containment and blast-radius objectives.
  intent: Make consequential failure containment independently diagnosable from recovery.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The highest-consequence failure scenarios and containment objectives are explicitly selected and justified.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Direct failure exercises or equivalent runtime-capable verification remain within those containment objectives.
      classes:
      - operational_exercise
      - reproducible_test
      - formal_verification
    independence: independent_review
- id: REL-4.3
  level: 4
  statement: Recovery from a highest-consequence failure must meet explicit recovery-state and recovery-time objectives.
  intent: Make consequential recovery independently diagnosable from containment.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The recovery state and recovery-time objectives are explicit for selected highest-consequence failures.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Direct recovery exercises or equivalent runtime-capable verification meet those objectives.
      classes:
      - operational_exercise
      - reproducible_test
      - formal_verification
    independence: independent_review
- id: REL-5.1
  level: 5
  statement: Highest-consequence multi-fault scenarios must remain within explicit continuity and recovery bounds throughout
    the stated failure envelope.
  intent: Establish exceptional confidence in resilience under compounded faults.
  applicability:
    mode: always
  evidence:
    required:
    - demonstrates: The highest-consequence multi-fault scenarios, recovery properties, and failure envelope are explicit.
      classes:
      - artifact_inspection
      - analysis
    - demonstrates: Independent reproduction confirms continuity and recovery bounds across that failure envelope.
      classes:
      - operational_exercise
      - reproducible_test
      - formal_verification
    independence: independent_reproduction
